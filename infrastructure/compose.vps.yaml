name: flagman-vps
services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
    - --api.insecure=true
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --entrypoints.web.address=:80
    - --entrypoints.web.http.redirections.entrypoint.to=websecure
    - --entrypoints.web.http.redirections.entrypoint.scheme=https
    - --entrypoints.web.http.redirections.entrypoint.permanent=true
    - --entrypoints.websecure.address=:443
    - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=0s
    - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL}
    - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
    - 80:80
    - 443:443
    - 127.0.0.1:${TRAEFIK_PORT:-8081}:8080
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - certificates:/letsencrypt
    networks:
    - flagman
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?Set POSTGRES_PASS}
    volumes:
    - postgres-data:/var/lib/postgresql
    networks:
    - warehouse
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$$POSTGRES_PASSWORD" psql -X -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
      target: migrate
    environment:
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL}
    networks:
    - warehouse
    depends_on:
      db:
        condition: service_healthy
  monitoring-init:
    image: postgres:18-alpine
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASS:?Set POSTGRES_PASS}
      FLAGMAN_GRAFANA_PASSWORD: ${GRAFANA_PG_PASSWORD:?Set GRAFANA_PG_PASSWORD}
    entrypoint:
    - psql
    - -X
    - -v
    - ON_ERROR_STOP=1
    - -f
    - /grafana-role.sql
    volumes:
    - ./monitoring/grafana-role.sql:/grafana-role.sql:ro
    networks:
    - warehouse
    depends_on:
      migrate:
        condition: service_completed_successfully
  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
    restart: unless-stopped
    environment:
      ENV: production
      GIN_MODE: release
      PORT: '8080'
      FRONTEND_ORIGIN: https://${FLAGMAN_DOMAIN:?Set FLAGMAN_DOMAIN}
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN}
    networks:
    - flagman
    - warehouse
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/api/v1/ready
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
    restart: unless-stopped
    networks:
    - flagman
    depends_on:
      backend:
        condition: service_healthy
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${COMPOSE_PROJECT_NAME:-flagman-vps}
      traefik.http.routers.frontend.rule: Host(`${FLAGMAN_DOMAIN:?Set FLAGMAN_DOMAIN}`)
      traefik.http.routers.frontend.entrypoints: websecure
      traefik.http.services.frontend.loadbalancer.server.port: '80'
      traefik.http.services.frontend.loadbalancer.responseforwarding.flushinterval: -1ms
      traefik.http.routers.frontend.tls: 'true'
      traefik.http.routers.frontend.tls.certresolver: letsencrypt
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN}
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - umask 077; test "$${#METRICS_TOKEN}" -ge 32; printf '%s' "$$METRICS_TOKEN" > /tmp/flagman-metrics-token; exec /bin/prometheus
      --config.file=/etc/prometheus/prometheus.yaml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    volumes:
    - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    - prometheus-data:/prometheus
    networks:
    - flagman
    depends_on:
      backend:
        condition: service_healthy
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports:
    - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      FLAGMAN_GRAFANA_PASSWORD: ${GRAFANA_PG_PASSWORD:?Set GRAFANA_PG_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    volumes:
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    - grafana-data:/var/lib/grafana
    networks:
    - flagman
    - warehouse
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
  seed:
    profiles:
    - tools
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
      target: seed-users
    command:
    - -data
    environment:
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:-}
      DEMO_STOREKEEPER_PASSWORD: ${DEMO_STOREKEEPER_PASSWORD:-}
      DEMO_ORDER_OPERATOR_PASSWORD: ${DEMO_ORDER_OPERATOR_PASSWORD:-}
    networks:
    - warehouse
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data: {}
  prometheus-data: {}
  grafana-data: {}
  certificates: {}
networks:
  flagman:
    name: ${COMPOSE_PROJECT_NAME:-flagman-vps}
  warehouse:
    internal: true
