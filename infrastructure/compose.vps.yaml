# Standalone VPS deployment: one dotenv file and automatic HTTPS.
name: flagman-vps
services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=0s
      - --entrypoints.admin.address=:8081
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME email}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports: ["80:80", "443:443", "127.0.0.1:8081:8081"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certificates:/letsencrypt
    networks: [flagman]
    labels:
      traefik.enable: "true"
      traefik.docker.network: flagman-vps
      traefik.http.routers.traefik.rule: PathPrefix(`/dashboard/`) || PathPrefix(`/api/`)
      traefik.http.routers.traefik.entrypoints: admin
      traefik.http.routers.traefik.service: api@internal
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?Set database password}
    networks: [warehouse]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    image: gomicro/goose:latest
    restart: on-failure:3
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${POSTGRES_URL:?Set internal database URL}
    entrypoint: ["goose", "-dir", "/migrations"]
    command: ["up"]
    volumes: ["../backend/database/migrations:/migrations:ro"]
    networks: [warehouse]
    depends_on:
      db: {condition: service_healthy}
  monitoring-init:
    image: postgres:18-alpine
    restart: on-failure:3
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?Set database name}
      PGUSER: ${POSTGRES_USER:?Set database user}
      PGPASSWORD: ${POSTGRES_PASS:?Set database password}
      FLAGMAN_GRAFANA_PASSWORD: ${GRAFANA_PG_PASSWORD:?Set Grafana database password}
    entrypoint: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/scripts/grafana-role.sql"]
    volumes: ["./monitoring/grafana-role.sql:/scripts/grafana-role.sql:ro"]
    networks: [warehouse]
    depends_on:
      migrate: {condition: service_completed_successfully}
  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
    restart: unless-stopped
    environment:
      ENV: production
      GIN_MODE: release
      PORT: "8080"
      FRONTEND_ORIGIN: https://${FLAGMAN_DOMAIN:?Set public DNS hostname}
      POSTGRES_URL: ${POSTGRES_URL:?Set internal database URL}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set metrics token of at least 32 characters}
    networks: [flagman, warehouse]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
    restart: unless-stopped
    networks: [flagman]
    depends_on:
      backend: {condition: service_healthy}
    labels:
      traefik.enable: "true"
      traefik.docker.network: flagman-vps
      traefik.http.routers.frontend.rule: Host(`${FLAGMAN_DOMAIN:?Set public DNS hostname}`)
      traefik.http.routers.frontend.entrypoints: websecure
      traefik.http.routers.frontend.tls: "true"
      traefik.http.routers.frontend.tls.certresolver: letsencrypt
      traefik.http.services.frontend.loadbalancer.server.port: "80"
      traefik.http.services.frontend.loadbalancer.responseforwarding.flushinterval: -1ms
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?Set metrics token}
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    volumes:
      - ./monitoring/prometheus.vps.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./monitoring/prometheus-entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - prometheus-data:/prometheus
    networks: [flagman]
    depends_on: [backend]
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set database name}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set Grafana admin password}
      FLAGMAN_GRAFANA_PASSWORD: ${GRAFANA_PG_PASSWORD:?Set Grafana database password}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [flagman, warehouse]
    depends_on:
      monitoring-init: {condition: service_completed_successfully}
  seed-users:
    profiles: [ops]
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
      target: seed-users
    environment:
      GOOSE_DBSTRING: ${POSTGRES_URL:?Set internal database URL}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:-}
      DEMO_STOREKEEPER_PASSWORD: ${DEMO_STOREKEEPER_PASSWORD:-}
      DEMO_ORDER_OPERATOR_PASSWORD: ${DEMO_ORDER_OPERATOR_PASSWORD:-}
    networks: [warehouse]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  postgres-data:
  certificates:
  prometheus-data:
  grafana-data:
networks:
  flagman:
    name: flagman-vps
  warehouse:
    internal: true
