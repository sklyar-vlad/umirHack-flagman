# Only used with compose.ci.yaml in the owned disposable demo project.
services:
  backend:
    environment:
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
    secrets: [metrics_token]

  prometheus:
    profiles: [smoke]
    image: prom/prometheus:v3.5.0
    user: "${FLAGMAN_CI_UID}:${FLAGMAN_CI_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    secrets: [metrics_token]
    tmpfs:
      - /prometheus:uid=${FLAGMAN_CI_UID},gid=${FLAGMAN_CI_GID}
    networks: [test]

  grafana:
    profiles: [smoke]
    image: grafana/grafana:12.1.1
    user: "${FLAGMAN_CI_UID}:${FLAGMAN_CI_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/bin/sh", "/etc/grafana/entrypoint.sh"]
    environment:
      POSTGRES_DB: flagman_ci_test
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    secrets: [grafana_admin_password, grafana_pg_password]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./monitoring/grafana/entrypoint.sh:/etc/grafana/entrypoint.sh:ro
    tmpfs:
      - /var/lib/grafana:uid=${FLAGMAN_CI_UID},gid=${FLAGMAN_CI_GID}
      - /var/log/grafana:uid=${FLAGMAN_CI_UID},gid=${FLAGMAN_CI_GID}
      - /tmp:uid=${FLAGMAN_CI_UID},gid=${FLAGMAN_CI_GID}
    ports: ["127.0.0.1::3000"]
    networks: [test]

secrets:
  metrics_token:
    file: ${FLAGMAN_CI_DIR}/metrics_token
  grafana_admin_password:
    file: ${FLAGMAN_CI_DIR}/grafana_admin_password
  grafana_pg_password:
    file: ${FLAGMAN_CI_DIR}/grafana_pg_password
