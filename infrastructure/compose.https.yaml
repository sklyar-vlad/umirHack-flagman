# Standalone HTTPS deployment. Do not combine with compose.yaml/compose.local.yaml.
name: flagman-https
services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/tls.yaml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=0s
      - --entrypoints.admin.address=:8081
    ports: ["80:80", "443:443", "127.0.0.1:8081:8081"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./tls.yaml:/etc/traefik/tls.yaml:ro
    secrets: [tls_chain, tls_key]
    networks: [flagman]
    labels:
      traefik.enable: "true"
      traefik.docker.network: flagman-https
      traefik.http.routers.traefik.rule: PathPrefix(`/dashboard/`) || PathPrefix(`/api/`)
      traefik.http.routers.traefik.entrypoints: admin
      traefik.http.routers.traefik.service: api@internal
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set the database user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, grafana_pg_password]
    networks: [warehouse]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
    restart: unless-stopped
    environment:
      ENV: production
      GIN_MODE: release
      PORT: "8080"
      FRONTEND_ORIGIN: https://${FLAGMAN_DOMAIN:?Set the final public DNS hostname}
      POSTGRES_URL_FILE: /run/secrets/postgres_url
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
    secrets: [postgres_url, metrics_token]
    networks: [flagman, warehouse]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
    restart: unless-stopped
    networks: [flagman]
    depends_on: [backend]
    labels:
      traefik.enable: "true"
      traefik.docker.network: flagman-https
      traefik.http.routers.frontend.rule: Host(`${FLAGMAN_DOMAIN:?Set the final public DNS hostname}`)
      traefik.http.routers.frontend.entrypoints: websecure
      traefik.http.routers.frontend.tls: "true"
      traefik.http.services.frontend.loadbalancer.server.port: "80"
      traefik.http.services.frontend.loadbalancer.responseforwarding.flushinterval: -1ms
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    secrets: [metrics_token]
    networks: [flagman]
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    entrypoint: ["/bin/sh", "/etc/grafana/entrypoint.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the database name}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    secrets: [grafana_admin_password, grafana_pg_password]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./monitoring/grafana/entrypoint.sh:/etc/grafana/entrypoint.sh:ro
      - grafana-data:/var/lib/grafana
    networks: [flagman, warehouse]
  db-tools:
    image: postgres:18-alpine
    profiles: [ops]
    entrypoint: ["sh", "/scripts/tools.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?Set database name}
      PGUSER: ${POSTGRES_USER:?Set database user}
    secrets: [postgres_password]
    volumes:
      - ./database:/scripts:ro
      - ${FLAGMAN_BACKUP_DIR:?Set absolute backup directory outside repository}:/backup
    networks: [warehouse]
  migrate:
    image: gomicro/goose:latest
    profiles: [ops]
    entrypoint: ["sh", "/scripts/migrate.sh"]
    secrets: [postgres_url]
    volumes:
      - ./database:/scripts:ro
      - ../backend/database/migrations:/migrations:ro
    networks: [warehouse]

secrets:
  postgres_password:
    file: ${FLAGMAN_SECRETS_DIR:?Set absolute secrets directory outside repository}/postgres_password
  postgres_url:
    file: ${FLAGMAN_SECRETS_DIR:?Set secrets directory}/postgres_url
  metrics_token:
    file: ${FLAGMAN_SECRETS_DIR:?Set secrets directory}/metrics_token
  grafana_admin_password:
    file: ${FLAGMAN_SECRETS_DIR:?Set secrets directory}/grafana_admin_password
  grafana_pg_password:
    file: ${FLAGMAN_SECRETS_DIR:?Set secrets directory}/grafana_pg_password
  tls_chain:
    file: ${FLAGMAN_TLS_DIR:?Set absolute certificate directory outside repository}/fullchain.pem
  tls_key:
    file: ${FLAGMAN_TLS_DIR:?Set certificate directory}/privkey.pem
volumes:
  postgres-data:
    name: flagman-https-postgres
  prometheus-data:
  grafana-data:
networks:
  flagman:
    name: flagman-https
  warehouse:
    name: flagman-https-warehouse
    internal: true
