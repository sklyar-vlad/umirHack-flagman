name: flagman

services:
  traefik:
    image: traefik:v3.7
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.transport.respondingtimeouts.writetimeout=0s"
    ports:
      - "80:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=flagman"
      - "traefik.http.routers.traefik.rule=Host(`traefik.flagman.localhost`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - flagman

  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    networks:
      - flagman
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - "postgres-data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
    restart: unless-stopped
    volumes:
      - .env:/app/.env:ro
    networks:
      - flagman
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=flagman"
      - "traefik.http.routers.backend.rule=Host(`api.flagman.localhost`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.http.services.backend.loadbalancer.responseforwarding.flushinterval=-1ms"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
    restart: unless-stopped
    networks:
      - flagman
    depends_on:
      - backend
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=flagman'
      - 'traefik.http.routers.frontend.rule=Host(`flagman.localhost`)'
      - 'traefik.http.routers.frontend.entrypoints=web'
      - 'traefik.http.services.frontend.loadbalancer.server.port=80'
      - 'traefik.http.services.frontend.loadbalancer.responseforwarding.flushinterval=-1ms'

volumes:
  postgres-data:
    name: "flagman-postgres"

networks:
  flagman:
    name: "flagman"
    driver: bridge
