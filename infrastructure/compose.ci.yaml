# Standalone test stack. Never combine with application/deployment Compose files.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: flagman_ci_test
      POSTGRES_USER: flagman_ci
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "flagman_ci", "-d", "flagman_ci_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - test

  backend:
    profiles: [smoke]
    image: ${FLAGMAN_CI_IMAGE:?Use scripts/backend-ci.sh}
    user: "${FLAGMAN_CI_UID:?Use scripts/backend-ci.sh}:${FLAGMAN_CI_GID:?Use scripts/backend-ci.sh}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ENV: development
      GIN_MODE: release
      PORT: "8080"
      FRONTEND_ORIGIN: http://flagman-ci.invalid
      POSTGRES_URL_FILE: /run/secrets/postgres_url
    secrets:
      - postgres_url
    ports:
      - "127.0.0.1::8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - test

secrets:
  postgres_password:
    file: ${FLAGMAN_CI_DIR:?Use scripts/backend-ci.sh}/postgres_password
  postgres_url:
    file: ${FLAGMAN_CI_DIR:?Use scripts/backend-ci.sh}/postgres_url

networks:
  test:
    driver: bridge
