name: Frontend CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITEST_MAX_WORKERS: '2'
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Lint, TypeScript, all unit tests and production build
        run: ./scripts/frontend-checks.sh
      - name: Selected browser acceptance with explicit MSW
        working-directory: frontend
        run: npm run test:acceptance
      - name: Real local Compose and isolated API acceptance
        working-directory: frontend
        run: npm run test:production
