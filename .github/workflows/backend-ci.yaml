name: Backend CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install pinned check tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Format, lint, unit calculations, vet and build
        run: bash scripts/backend-checks.sh all

  integration:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Real PostgreSQL transactions with automatic container migrations
        run: bash scripts/integration-checks.sh backend
