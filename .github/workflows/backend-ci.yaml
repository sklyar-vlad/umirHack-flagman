name: Backend CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install pinned check tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Format, lint, unit calculations, vet and build
        run: task backend:check
      - name: Check CI harness contracts
        run: python3 -m unittest discover -s scripts -p 'test_backend_ci.py' -v

  integration:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install pinned integration tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          go install github.com/pressly/goose/v3/cmd/goose@v3.27.1
      - name: Real PostgreSQL transactions and forward migrations
        run: task backend:integration
      - name: Build image and isolated Compose API smoke
        run: task backend:smoke
