version: "3"

vars:
  ENV_FILE: '{{.ENV_FILE | default "./infrastructure/.env"}}'

env:
  FLAGMAN_ENV_FILE: '{{.ENV_FILE}}'

tasks:
  default:
    cmds: [task --list]
    silent: true
  up:
    desc: Собрать и запустить local/VPS; схема БД готовится автоматически
    cmds: [sh infrastructure/manage.sh up]
  down:
    desc: Остановить контейнеры, сохранив данные
    cmds: [sh infrastructure/manage.sh down]
  logs:
    desc: Смотреть логи
    cmds: [sh infrastructure/manage.sh logs]
  seed:
    desc: Добавить демопользователей, каталог, рецепты и партии через контейнер
    cmds: [sh infrastructure/manage.sh seed]
