version: "3"

vars:
  COMPOSE_CMD: docker compose --env-file ./infrastructure/.env -f ./infrastructure/compose.yaml
  GOOSE_CMD: goose -env ./infrastructure/.env -dir ./backend/migrations

tasks:
  default:
    cmds:
      - 'task --list'
    silent: true

### START

  up:
    desc: Поднять БД, применить миграции и запустить приложение
    cmds:
      - '{{.COMPOSE_CMD}} stop frontend backend'
      - '{{.COMPOSE_CMD}} up -d --wait --wait-timeout 60 db'
      - task: migrate
      - '{{.COMPOSE_CMD}} up -d --build traefik backend frontend'

### STOP

  down:
    desc: down all containers
    cmds:
      - echo "⚠️  stopping containers... ⚠️"
      - docker compose -f ./infrastructure/compose.yaml down
      - echo "✅ all containers stopped and removed ✅"
    silent: true

### LOGS

  logs:
    desc: check logs all containers
    cmds:
      - docker compose -f ./infrastructure/compose.yaml logs -f

### DATABASE 

  migration:
    desc: Создать SQL-миграцию
    vars:
      NAME: '{{.NAME | default "migration"}}'
    cmds:
      - '{{.GOOSE_CMD}} -s create "{{.NAME}}" sql'

  migrate:
    desc: Применить все ожидающие миграции
    cmds:
      - '{{.GOOSE_CMD}} up'

  migrate-one:
    desc: Применить одну следующую миграцию
    cmds:
      - '{{.GOOSE_CMD}} up-by-one'

  migrate-status:
    desc: Показать состояние миграций
    cmds:
      - '{{.GOOSE_CMD}} status'

  migrate-version:
    desc: Показать текущую версию схемы
    cmds:
      - '{{.GOOSE_CMD}} version'

  migrate-validate:
    desc: Проверить формат файлов миграций
    cmds:
      - '{{.GOOSE_CMD}} validate'

  rollback-one:
    desc: Откатить одну последнюю миграцию
    cmds:
      - '{{.GOOSE_CMD}} down'

  rollback:
    desc: Откатить все миграции
    cmds:
      - '{{.GOOSE_CMD}} reset'

  seed:
    desc: Заполнить начальные справочники, рецептуры и настройки
    preconditions:
      - sh: test -f ./infrastructure.env
        msg: Создай infrastructure/.env из infrastructure/.env.example
      - sh: test -f ./backend/seeds/001_catalog.sql
        msg: Не найден backend/seeds/001_catalog.sql
    cmds:
      - '{{.COMPOSE_CMD}} up -d --wait --wait-timeout 60 db'
      - task: migrate
      - >-
          {{.COMPOSE_CMD}} exec -T db
          sh -c 'exec psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          < ./backend/seeds/001_catalog.sql

### LINTING

  lint:
    dir: backend
    desc: formatting project
    cmds:
      - echo "⚠️  start linting... ⚠️"
      - go fmt ./...
      - golangci-lint run --fix
      - echo "✅ linting and formatting finished ✅"
    silent: true

