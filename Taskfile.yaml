version: "3"

tasks:
  default:
    cmds:
      - 'task --list'
    silent: true

### START

  up:
    desc: up all containers
    cmds:
      - echo "⚠️  starting containers... ⚠️"
      - docker compose -f ./infrastructure/compose.yaml up -d --build
      - echo "✅ all containers started ✅"
    silent: true

### STOP

  down:
    desc: down all containers
    cmds:
      - echo "⚠️  stopping containers... ⚠️"
      - docker compose -f ./infrastructure/compose.yaml down
      - echo "✅ all containers stopped and removed ✅"
    silent: true

### LOGS

  logs:
    desc: check logs all containers
    cmds:
      - docker compose -f ./infrastructure/compose.yaml logs -f

### DB

### DATABASE 

  migration:
    desc: create new migration file. example "task migration NAME=name_of_migration"
    cmds:
      - goose -s create {{.NAME}} sql -dir ./backend/migrations
    vars:
      NAME: '{{.NAME | default "migration"}}'

  migrate:
    desc: choose last version of migrations
    cmds:
      - goose -env ./infrastructure/.env up 
      - echo "Success migrated"

  migrate-one:
    desc: choose next version of migrations 
    cmds:
      - goose -env ./infrastructure/.env up-by-one 

  rollback:
    desc: roll back all migrations
    cmds:
      - goose -env ./infrastructure/.env reset

  rollback-one:
    desc: comeback to previous version of migrations
    cmds:
      - goose -env ./infrastructure/.env down 


### LINTING

  lint:
    dir: backend
    desc: formatting project
    cmds:
      - echo "⚠️  start linting... ⚠️"
      - go fmt ./...
      - golangci-lint run --fix
      - echo "✅ linting and formatting finished ✅"
    silent: true

