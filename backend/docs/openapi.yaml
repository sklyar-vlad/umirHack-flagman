openapi: 3.0.3
info:
  title: Кладовая — API учёта склада и заказов
  version: 0.1.0
  contact:
    name: Команда проекта Кладовая
  description: |
    Стартовый контракт S02-T04 на основе REST API из README.md.
    Реализованы GET /healthcheck, GET /products, GET /products/{id}/batches, GET /inventory,
    POST /supplies, GET /supplies, GET /supplies/{id}, GET /dishes,
    GET /dishes/{id}, GET /stop-list и POST /orders/check.
    Операции с x-implementation-status: planned
    описывают согласованное будущее поведение, а не доступные сейчас маршруты.
    В каждой стори добавляются её операции, схемы, примеры и статусы реализации.

    Даты: RFC 3339 с timezone; ответы сервера — UTC.
    Количества: точные десятичные JSON-строки в базовых единицах g/ml/pcs,
    до 11 цифр до точки и до 3 после (numeric(14,3)). Для pcs дробь нулевая.
    Суммы партий в InventoryItem могут превышать предел одной партии;
    они возвращаются строками с тремя знаками после точки без ограничения целой части.
    Сервер не использует float64 для складского учёта.

    Ограничения HTTP из S02-T05 уже подключены. Тело любого запроса —
    не более 1048576 байт (1 МиБ); превышение даёт 413 PAYLOAD_TOO_LARGE,
    в том числе при неизвестном Content-Length. Проверяется полное тело.
    Общий token bucket на один процесс backend пополняется со скоростью
    10 разрешений в секунду, максимальный и начальный запас — 20.
    Все клиенты совместно расходуют этот запас; это не отдельный лимит по IP
    или пользователю. Экземпляры backend учитывают частоту независимо.
    При исчерпании запаса — 429 TOO_MANY_REQUESTS и Retry-After: 1.
    Ровно GET /healthcheck исключён из ограничения частоты, но лимит тела
    действует и на него. Неизвестные маршруты также проходят ограничения.

    Общие проверки входных коллекций допускают 1–100 строк поставки/корзины
    или ингредиентов рецепта и 1–1000 порций каждого блюда после объединения.
    Подключение этих проверок к бизнес-запросам и объединение корзины
    выполняются при реализации соответствующих planned-операций.

    Фильтры объединяются через AND. Поиск без учёта регистра.
    Каждый query-параметр допускается один раз. Неизвестный параметр,
    неверный фильтр, сортировка, UUID или пагинация дают 422.
    Сортировка стабильная, последний критерий — ID.
    total считается после фильтров, до пагинации; пустой список — 200 с items: [].

    Отсутствующий запрошенный ресурс и неизвестный маршрут дают одинаковый
    формат 404 NOT_FOUND. Неверная ссылка в теле запроса даёт 422 с путём поля.
    Внутренние SQL-ошибки не раскрываются клиенту.
    X-Request-ID связывает ответ с логами; request_id ошибки совпадает с ним.
    Request ID генерируется сервером и не является Idempotency-Key.

    Поставки требуют действующую сессию flagman_session и проверку роли.
    Для POST обязательны X-CSRF-Token и Origin, совпадающий с FRONTEND_ORIGIN
    (по умолчанию http://flagman.localhost). Выдача сессий через login пока
    не реализована. Запланированные бизнес-операции также требуют авторизацию
    согласно README после подключения их маршрутов.

    UUID и даты примеров иллюстративные: при реальном запросе используйте
    существующие ID и актуальные сроки годности.
servers:
  - url: /api/v1
    description: API на текущем origin, включая frontend через nginx
  - url: http://api.flagman.localhost/api/v1
    description: Прямой доступ к backend через локальный Traefik
tags:
  - name: System
    description: Состояние процесса
  - name: Inventory
    description: Продукты и склад
  - name: Supplies
    description: Приём и чтение поставок
  - name: Dishes
    description: Меню и доступность блюд
  - name: Orders
    description: Проверка корзины, создание и чтение заказа
paths:
  /healthcheck:
    get:
      tags: [System]
      operationId: healthcheck
      summary: Проверить, что HTTP-процесс отвечает
      description: |
        Не проверяет готовность БД и миграций. Публичный маршрут.
        Исключён из ограничения частоты. Лимит тела 1 МиБ действует,
        если клиент передаёт тело запроса.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Процесс отвечает
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthcheckResponse'
              example:
                status: ok
                service: umirHack-flagman
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /products:
    get:
      tags: [Inventory]
      operationId: listProducts
      summary: Получить продукты для каталога и формы поставки
      description: |
        Чтение разрешено всем четырём ролям при действующей сессии.
        Для форм возвращаются ID, имя, категория (ID и имя), базовая и
        отображаемая единицы, стандартный срок хранения и целевой запас.
        Ответ также содержит is_active, revision и created_at в UTC.
        По умолчанию is_active=true. Поиск — буквальная часть имени без учёта
        регистра; %, _ и обратный слеш не являются шаблонами.
        Фильтры объединяются через AND; неизвестная категория даёт пустой список.
        Порядок name ASC, id ASC. Счётчик и страница читаются в одном снимке.
        Отсутствующий стандартный срок или целевой запас — null;
        нулевой целевой запас — строка '0.000'.
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CategoryID'
        - $ref: '#/components/parameters/IsActive'
        - name: sort
          in: query
          schema: {type: string, enum: [name], default: name}
          example: name
      responses:
        '200':
          description: Продукты после фильтров; пустая выборка также успешна
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
              examples:
                products:
                  $ref: '#/components/examples/ProductList'
                empty:
                  $ref: '#/components/examples/EmptyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /products/{id}/batches:
    get:
      tags: [Inventory]
      operationId: listProductBatches
      summary: Получить партии продукта с текущими остатками и сроками
      description: |
        Реализовано в S07-T04. Доступно всем четырём ролям при действующей сессии.
        Без status возвращаются все ненулевые партии; status=all включает израсходованные.
        Партии отключённых продуктов доступны. Неизвестный продукт — 404;
        существующий продукт без подходящих партий — 200 с items: [].
        supply_id и status объединяются через AND; неизвестная поставка даёт пустой список.
        По умолчанию expires_at ASC, id ASC; sort=-created_at — created_at DESC, id ASC.
        total считается после фильтров, до пагинации, в том же снимке, что и страница.
        Статусы и оставшиеся секунды рассчитываются на одно T = meta.server_time.
        depleted имеет приоритет при нулевом остатке; иначе expires_at <= T — expired,
        T < expires_at <= T + expiring_threshold_hours — expiring, позже — valid.
        При expires_at = T статус expired (или depleted при нуле), remaining_seconds = 0.
        Порог из настроек ресторана, без строки настроек — 24 часа.
        remaining_seconds — floor((expires_at - T) / 1s), в том числе у depleted.
        Фактический срок не пересчитывается по стандарту продукта; даты ответа — UTC.
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: Без параметра — ненулевые партии; all включает depleted
          schema: {type: string, enum: [all, valid, expiring, expired, depleted]}
          example: all
        - name: supply_id
          in: query
          description: Ограничить партии данного продукта одной поставкой
          schema:
            $ref: '#/components/schemas/UUID'
        - name: sort
          in: query
          schema: {type: string, enum: [expires_at, '-created_at'], default: expires_at}
      responses:
        '200':
          description: Партии после фильтров; пустая выборка также успешна
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchListResponse'
              examples:
                batches:
                  $ref: '#/components/examples/BatchList'
                empty:
                  value:
                    items: []
                    total: 0
                    page: 1
                    page_size: 50
                    meta: {server_time: '2026-10-10T12:00:00Z'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /inventory:
    get:
      tags: [Inventory]
      operationId: listInventory
      summary: Получить остатки, статусы продуктов и проблемные партии
      description: |
        Агрегаты реализованы в S07-T02, поиск и фильтры проверены в S07-T03.
        Включает продукты без партий и неактивные продукты.
        Доступно всем четырём ролям. counts учитывает поиск и категорию,
        но игнорирует filter и пагинацию; фильтры пересекаются.
        attention_batches — первые 20 проблемных партий по expires_at, id
        в том же поиске/категории; attention_total — их полное число.
        nearest_expires_at сортируется с null в конце.
        Все агрегаты используют один момент T = meta.server_time и один снимок БД.
        available: expires_at > T; expired: expires_at <= T.
        expiring входит в available и имеет expires_at <= T + expiring_threshold_hours.
        Порог берётся из настроек ресторана, без строки настроек — 24 часа.
        Нулевые партии не входят в batches_count, ближайший срок и attention_batches.
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CategoryID'
        - name: filter
          in: query
          description: |
            Фильтрация по количествам независимо от основного status продукта.
            expiring: expiring_quantity > 0; expired: expired_quantity > 0;
            out_of_stock: available_quantity = 0; deficit: deficit_quantity > 0.
            Продукт может одновременно входить в несколько фильтров.
          schema:
            type: string
            enum: [all, expiring, expired, out_of_stock, deficit]
            default: all
          example: expiring
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, nearest_expires_at]
            default: name
          example: nearest_expires_at
      responses:
        '200':
          description: Складская выборка с агрегатами
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryListResponse'
              examples:
                inventory:
                  $ref: '#/components/examples/InventoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /supplies:
    get:
      tags: [Supplies]
      operationId: listSupplies
      summary: Получить список поставок
      description: |
        Поиск по буквальной части номера без учёта регистра; пустой search
        не ограничивает выборку. Символы %, _ и обратный слеш не являются
        шаблонами. Фильтры объединяются через AND.
        from включительно и to исключительно ограничивают created_at,
        а не received_at. RFC3339 с timezone; from <= to, равные границы
        возвращают пустой список. Порядок created_at DESC, id DESC.
        total учитывает фильтры до пагинации; страница за концом списка
        возвращает items: [] с исходным total. meta — {}.
        Требуется действующая сессия и роль admin, manager или storekeeper.
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Буквальная часть номера, без учёта регистра
          schema: {type: string}
          example: '104'
        - name: from
          in: query
          description: Нижняя включительная граница created_at
          schema: {type: string, format: date-time}
          example: '2026-10-01T00:00:00Z'
        - name: to
          in: query
          description: Верхняя исключительная граница created_at
          schema: {type: string, format: date-time}
          example: '2026-11-01T00:00:00Z'
        - name: sort
          in: query
          description: Фиксированная стабильная сортировка; других значений нет
          schema: {type: string, enum: ['-created_at'], default: '-created_at'}
      responses:
        '200':
          description: Список поставок, включая пустую страницу
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyListResponse'
              example:
                items: []
                total: 0
                page: 1
                page_size: 50
                meta: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Supplies]
      operationId: createSupply
      summary: Принять поставку и создать партии
      description: |
        Роли admin, manager, storekeeper. Вся поставка сохраняется атомарно.
        Каждая строка создаёт отдельную партию; повтор продукта допустим.
        Количество положительное, для pcs целое. Просроченная строка даёт 422
        без сохранения всей поставки. Номер обрезается по краям, должен быть
        непустым и уникальным в ресторане с учётом регистра.
        Строка задаёт expires_at либо produced_at с необязательным сроком.
        Без срока используется стандарт продукта; если его нет — 422 SHELF_LIFE_REQUIRED.
        Location указывает на детали созданной поставки.
        Тело ответа строится и сохраняется до commit; 201 отправляется после commit.
        Повтор с тем же ключом и телом возвращает сохранённый статус, тело и Location.
        meta.server_time фиксирует время расчёта статусов партий.
        Невалидный JSON и проверки входных данных до транзакции не занимают ключ.
        Проверки состояния продуктов и срока по текущему времени выполняются
        после сериализации ключа; завершённые предметные отказы сохраняются.
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplyRequest'
            examples:
              explicitExpiry:
                $ref: '#/components/examples/SupplyExplicitRequest'
              calculatedExpiry:
                $ref: '#/components/examples/SupplyCalculatedRequest'
      responses:
        '201':
          description: Поставка принята; схема совпадает с GET деталей, значения зафиксированы при приёмке
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Location:
              description: Путь к созданной поставке
              schema: {type: string}
              example: /api/v1/supplies/45454545-4545-4545-8545-454545454545
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyDetail'
              examples:
                supply:
                  $ref: '#/components/examples/SupplyDetail'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /supplies/{id}:
    get:
      tags: [Supplies]
      operationId: getSupply
      summary: Получить поставку с исходными строками и текущими партиями
      description: |
        Все партии по line_number ASC, id ASC, включая израсходованные,
        просроченные и партии отключённых продуктов. Повторные продукты
        в разных строках не объединяются. Продукты и партии читаются вместе
        с поставкой в одном снимке REPEATABLE READ READ ONLY.
        created_at — время создания записи поставки; received_at — фактическое
        время приёмки. batch.created_at — время создания записи партии.
        Фактический срок партии не пересчитывается по стандарту продукта.
        Статусы и remaining_seconds используют одно meta.server_time;
        порог expiring берётся из настроек ресторана (без настроек — 24 часа).
        Query-параметров нет. Требуется действующая сессия и роль admin, manager или storekeeper.
        Корректный UUID отсутствующей поставки — 404; неверный UUID — 422.
        Данные читаются в одном согласованном снимке; время расчёта — meta.server_time.
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Детали поставки
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyDetail'
              examples:
                supply:
                  $ref: '#/components/examples/SupplyDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /dishes:
    get:
      tags: [Dishes]
      operationId: listDishes
      summary: Получить меню с рецептурами и доступностью
      description: |
        Роли admin, manager, order_operator. Актуальная версия рецепта выбирается
        по максимальному номеру. Порции — минимум целых отношений годного остатка
        к расходу ингредиента. Просрочка (expires_at <= meta.server_time) исключена.
        Поиск — буквальная подстрока названия без учёта регистра. total считается
        после фильтра доступности и до пагинации; сортировка name, затем ID.
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IsActive'
