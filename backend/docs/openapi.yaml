  /analytics/stop-list-forecast:
    get:
      tags: [Analytics]
      operationId: getStopListForecast
      summary: Оценка момента возникновения стоп-листа
      x-implementation-status: implemented
      description: |
        Только admin/manager. Все активные блюда с текущими рецептами. История только
        order_consumption по product_id/unit в [server_time-lookback_days,server_time),
        среднее за все 24-часовые дни периода. Непрерывное ожидаемое потребление склада
        по FEFO (expires_at, received_at, batch ID), исключение остатка при expires_at.
        Поиск первой невозможности приготовить порцию с учётом следующих партий.
        При расходе время — первая наносекунда после пересечения порога одной порции;
        при истечении — expires_at. Не предполагает будущие поставки и смену рецепта.
        Нет истории в текущей единице — неизвестный спрос, insufficient_data, отдельно
        оценка сроков без неизвестного расхода. Положительная история даёт только low.
        null/unknown различают no_stop_within_horizon и недостаток истории в assumptions.
        Уже недоступное блюдо имеет server_time/already_unavailable; без рецепта
        limiting_product_id=null. Сортировка estimated_stop_at ASC NULLS LAST, dish_id;
        при совпадении ограничений выбирается меньший product_id. Пагинация после расчёта.
        Один read-only Repeatable Read снимок рецептов, партий и истории. Никаких записей.
        Cache-Control no-store. Дубликаты, неизвестные и некорректные параметры дают 422.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: lookback_days
        in: query
        schema: {type: integer, minimum: 1, maximum: 90, default: 7}
      - name: horizon_hours
        in: query
        schema: {type: integer, minimum: 1, maximum: 720, default: 72}
      responses:
        '200':
          description: Оценки; total — число активных блюд до пагинации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopListForecastListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: flagman_session
      description: Непрозрачный токен действующей сессии; в БД хранится его SHA-256
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      description: UUID в формате xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      schema:
        $ref: '#/components/schemas/UUID'
      example: 44444444-4444-4444-8444-444444444444
    Page:
      name: page
      in: query
      description: Номер страницы, начиная с 1; допускается только одно значение
      schema: {type: integer, minimum: 1, default: 1}
      example: 1
    PageSize:
      name: page_size
      in: query
      description: Максимальное число элементов страницы
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      example: 50
    Search:
      name: search
      in: query
      description: Поиск по имени без учёта регистра
      schema: {type: string}
      example: Моцарелла
    HistoryFrom:
      name: from
      in: query
      description: Нижняя включительная граница created_at, RFC3339 с timezone
      schema: {type: string, format: date-time}
    HistoryTo:
      name: to
      in: query
      description: Верхняя исключительная граница created_at, RFC3339 с timezone; from <= to
      schema: {type: string, format: date-time}
    HistorySort:
      name: sort
      in: query
      description: Фиксированный порядок created_at DESC, id DESC
      schema: {type: string, enum: ['-created_at'], default: '-created_at'}
    CategoryID:
      name: category_id
      in: query
      description: Фильтр по категории продукта
      schema:
        $ref: '#/components/schemas/UUID'
      example: 22222222-2222-4222-8222-222222222222
    IsActive:
      name: is_active
      in: query
      description: Активные, неактивные или все записи
      schema: {type: string, enum: ['true', 'false', all], default: 'true'}
      example: 'true'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID отдельной попытки записи, не request ID. Связан с пользователем,
        методом/путём и хешем тела. Результат хранится минимум 24 часа.
        Повтор того же тела возвращает сохранённые статус и тело без повторной записи.
        Другое тело — 409 IDEMPOTENCY_CONFLICT; незавершённый параллельный
        запрос — 409 REQUEST_IN_PROGRESS с Retry-After.
        Хеш вычисляется по исходным байтам тела; изменение пробелов или порядка
        JSON-полей меняет хеш. Область ключа — пользователь, HTTP-метод и путь.
        Завершённый результат хранится минимум 24 часа. Повтор возвращает сохранённые
        статус, тело и Location; X-Request-ID относится к текущему запросу.
        Ошибки разбора, доступа и валидации до транзакции ключ не занимают.
        При expires_at <= текущему времени ключ может считаться новым.
        Очистка истёкшего кеша сохраняет самостоятельную историю отказов.
      schema:
        $ref: '#/components/schemas/UUID'
      example: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Токен из login/me для изменяющего запроса с сессией; проверяется также Origin
      schema: {type: string, minLength: 1}
      example: illustrative-csrf-token
    Origin:
      name: Origin
      in: header
      required: true
      description: Должен точно совпадать с FRONTEND_ORIGIN; по умолчанию http://flagman.localhost
      schema: {type: string}
      example: http://flagman.localhost
  headers:
    RequestID:
      description: UUID текущего HTTP-запроса, совпадает с request_id в ошибке и логах
      schema:
        $ref: '#/components/schemas/UUID'
      example: 99999999-9999-4999-8999-999999999999
  schemas:
    StopListForecast:
      type: object
      additionalProperties: false
      required: [dish_id, dish_name, estimated_stop_at, cause, limiting_product_id, confidence, assumptions]
      properties:
        dish_id:
          $ref: '#/components/schemas/UUID'
        dish_name: {type: string}
        estimated_stop_at: {type: string, format: date-time, nullable: true}
        cause: {type: string, enum: [already_unavailable, expiry, estimated_demand, unknown]}
        limiting_product_id: {type: string, format: uuid, nullable: true}
        confidence: {type: string, enum: [low, insufficient_data]}
        assumptions:
          type: array
          items: {type: string}
          description: |
            estimate_only, no_future_supplies, current_recipe_unchanged,
            constant_average_product_consumption_full_lookback, continuous_expected_consumption;
            дополнительно expiry_only_for_missing_history, missing_history:<product UUID>,
            recipe_missing, no_stop_within_horizon либо unknown_demand_no_expiry_stop_within_horizon.
    StopListForecastListResponse:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/StopListForecast'
          meta:
            type: object
            required: [server_time, lookback_days, horizon_hours]
            properties:
              server_time: {type: string, format: date-time}
              lookback_days: {type: integer, minimum: 1, maximum: 90}
              horizon_hours: {type: integer, minimum: 1, maximum: 720}
    WriteOffRequest:
      type: object
      additionalProperties: false
      required: [batch_id, quantity, reason]
      properties:
        batch_id:
          $ref: '#/components/schemas/UUID'
        quantity:
          $ref: '#/components/schemas/Quantity'
        reason: {type: string, minLength: 1, maxLength: 500}
    IngredientShortageAnalytics:
      type: object
      additionalProperties: false
      required: [product_id, product_name, unit, rejected_attempts_count, total_missing_quantity]
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name: {type: string}
        unit:
          $ref: '#/components/schemas/Unit'
        rejected_attempts_count: {type: integer, format: int64, minimum: 1}
        total_missing_quantity:
          $ref: '#/components/schemas/AggregateQuantity'
    IngredientShortageAnalyticsListResponse:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/IngredientShortageAnalytics'
    WriteOffAnalytics:
      type: object
      additionalProperties: false
      required: [product_id, product_name, unit, expired_written_off_quantity, manual_written_off_quantity, total_written_off_quantity, movements_count]
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name: {type: string}
        unit:
          $ref: '#/components/schemas/Unit'
        expired_written_off_quantity:
          $ref: '#/components/schemas/AggregateQuantity'
        manual_written_off_quantity:
          $ref: '#/components/schemas/AggregateQuantity'
        total_written_off_quantity:
          $ref: '#/components/schemas/AggregateQuantity'
        movements_count: {type: integer, format: int64, minimum: 1}
    WriteOffAnalyticsListResponse:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/WriteOffAnalytics'
    StockMovement:
      type: object
      additionalProperties: false
      required: [id, batch_id, product_id, product_name, unit, type, delta_quantity, remaining_quantity_after, order_item_id, order_id, actor, occurred_at, note]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        batch_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name: {type: string}
        unit: {type: string, enum: [g, ml, pcs]}
        type: {type: string, enum: [receipt, order_consumption, expiration, manual_writeoff]}
        delta_quantity: {type: string, pattern: '^-?[0-9]+[.][0-9]{3}$', example: '-1.125'}
        remaining_quantity_after:
          $ref: '#/components/schemas/Quantity'
        order_item_id: {type: string, format: uuid, nullable: true}
        order_id: {type: string, format: uuid, nullable: true}
        actor:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, name]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        occurred_at: {type: string, format: date-time}
        note: {type: string, nullable: true}
    StockMovementListResponse:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        meta: {type: object}
    Settings:
      type: object
      additionalProperties: false
      required: [restaurant_name, timezone, expiring_threshold_hours, auto_writeoff_expired, revision]
      properties:
        restaurant_name: {type: string, minLength: 1, maxLength: 200}
        timezone: {type: string, minLength: 1, maxLength: 100, example: Europe/Moscow}
        expiring_threshold_hours: {type: integer, minimum: 1, maximum: 720}
        auto_writeoff_expired: {type: boolean, example: false}
        revision: {type: integer, minimum: 1}
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      minProperties: 2
      properties:
        restaurant_name: {type: string, minLength: 1, maxLength: 200}
        timezone: {type: string, minLength: 1, maxLength: 100}
        expiring_threshold_hours: {type: integer, minimum: 1, maximum: 720}
        auto_writeoff_expired: {type: boolean, description: Включает списание просроченного положительного остатка в течение минуты}
        expected_revision: {type: integer, minimum: 1, maximum: 2147483646}
    AuditLogEntry:
      type: object
      additionalProperties: false
      required: [id, created_at, actor, action, entity_type, entity_id, request_id, before, after]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        created_at: {type: string, format: date-time}
        actor:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              $ref: '#/components/schemas/UUID'
            name: {type: string}
        action: {type: string, example: update}
        entity_type: {type: string, example: settings}
        entity_id: {type: string, format: uuid, nullable: true, description: null для singleton settings}
        request_id: {type: string, nullable: true}
        before: {type: object, nullable: true, description: Разрешённый типизированный снимок; null для создания}
        after: {type: object, nullable: true, description: Разрешённый типизированный снимок; неизвестные legacy типы скрываются}
    AuditLogListResponse:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        meta: {type: object}
    Role:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      properties:
        code:
          type: string
          enum:
          - admin
          - manager
          - storekeeper
          - order_operator
        name:
          type: string
    RoleListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    UserListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - page
      - page_size
      - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthUser'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        meta:
          type: object
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      - role
      - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: string
          enum:
          - admin
          - manager
          - storekeeper
          - order_operator
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        is_active:
          type: boolean
          default: true
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: string
          enum:
          - admin
          - manager
          - storekeeper
          - order_operator
        is_active:
          type: boolean
        expected_revision:
          type: integer
          minimum: 1
      minProperties: 2
    UserPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - password
      - expected_revision
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        expected_revision:
          type: integer
          minimum: 1
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, minLength: 1, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, name, email, role, is_active, revision, created_at, last_login_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name: {type: string}
        email: {type: string}
        role: {type: string, enum: [admin, manager, storekeeper, order_operator]}
        is_active: {type: boolean}
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        last_login_at: {type: string, format: date-time, nullable: true}
    LoginResponse:
      type: object
      required: [user, csrf_token, session_expires_at]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        csrf_token: {type: string}
        session_expires_at: {type: string, format: date-time}
    CurrentSessionResponse:
      allOf:
        - $ref: '#/components/schemas/LoginResponse'
        - type: object
          required: [settings]
          properties:
            settings:
              $ref: '#/components/schemas/DashboardSettings'
    UUID:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      example: 11111111-1111-4111-8111-111111111111
    Quantity:
      type: string
      pattern: '^[0-9]{1,11}(\.[0-9]{1,3})?$'
      description: |
        Точное неотрицательное количество numeric(14,3), максимум 99999999999.999.
        В базовой единице продукта; для pcs дробная часть должна быть нулевой.
        JSON-число, знак, экспонента и округление лишних знаков не допускаются.
      example: '120.000'
    PositiveQuantity:
      description: Положительное количество; ноль запрещён
      allOf:
        - $ref: '#/components/schemas/Quantity'
        - type: string
          pattern: '^(?!0+(\.0+)?$).+$'
      example: '3000.000'
    InventoryQuantity:
      type: string
      pattern: '^[0-9]+\.[0-9]{3}$'
      description: |
        Точная неотрицательная сумма остатков партий в базовой единице продукта.
        Три знака после точки; целая часть может превышать numeric(14,3) одной партии.
        Для pcs дробная часть нулевая. Float и округление не используются.
      example: '199999999999.998'
    AggregateQuantity:
      description: Точное количество агрегата остатков или потребности корзины; может превышать numeric(14,3) одной строки
      allOf:
        - $ref: '#/components/schemas/InventoryQuantity'
    NullableQuantity:
      type: string
      nullable: true
      pattern: '^[0-9]{1,11}(\.[0-9]{1,3})?$'
      description: Количество по правилам Quantity либо null, если значение не задано
      example: '4000.000'
    Unit:
      type: string
      enum: [g, ml, pcs]
      description: Базовая единица продукта; все количества относятся к ней
    DisplayUnit:
      type: string
      enum: [g, kg, ml, l, pcs]
      description: g допускает g/kg, ml — ml/l, pcs — только pcs
    Meta:
      type: object
      additionalProperties: true
      description: |
        Дополнительные сведения, без них — {}. Для расчётов server_time —
        общий момент расчёта ответа в UTC. request_id необязателен.
      properties:
        server_time: {type: string, format: date-time}
        request_id:
          $ref: '#/components/schemas/UUID'
    ListEnvelope:
      type: object
      required: [items, total, page, page_size, meta]
      description: |
        Общая обёртка, конкретная операция уточняет схему элементов items.
        total — число после фильтров до пагинации. items и meta не бывают null.
      properties:
        items:
          type: array
          items: {}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        meta:
          $ref: '#/components/schemas/Meta'
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        request_id:
          $ref: '#/components/schemas/UUID'
    ErrorBody:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          description: Стабильный машинный код; перечень дополняется в каждой стори
          example: NOT_FOUND
        message: {type: string, example: Ресурс не найден}
        details:
          type: object
          additionalProperties: true
          description: |
            Без дополнительных сведений — {}. fields используется при валидации.
            Предметные ошибки дополняют details согласно контракту операции.
          properties:
            fields:
              type: array
              items:
                $ref: '#/components/schemas/FieldViolation'
            requirements:
              type: array
              items:
                $ref: '#/components/schemas/Requirement'
            shortages:
              type: array
              items:
                $ref: '#/components/schemas/Shortage'
            issues:
              type: array
              items:
                $ref: '#/components/schemas/OrderIssue'
            attempt_id:
              $ref: '#/components/schemas/UUID'
    FieldViolation:
      type: object
      required: [path, code, message]
      properties:
        path: {type: string, example: 'items[0].quantity'}
        code: {type: string, example: invalid_value}
        message: {type: string, example: Количество должно быть больше нуля}
    HealthcheckResponse:
      type: object
      required: [status, service]
      properties:
        status: {type: string, enum: [ok]}
        service: {type: string, enum: [umirHack-flagman]}
    CatalogCategory:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - revision
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          minLength: 1
          maxLength: 200
        revision:
          type: integer
          minimum: 1
    CategoryListResponse:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/CatalogCategory'
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - expected_revision
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        expected_revision:
          type: integer
          minimum: 1
          maximum: 2147483646
    CreateProductRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - category_id
      - unit
      - display_unit
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        category_id:
          $ref: '#/components/schemas/UUID'
        unit:
          $ref: '#/components/schemas/Unit'
        display_unit:
          $ref: '#/components/schemas/DisplayUnit'
        standard_shelf_life_hours:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2147483647
        target_stock:
          $ref: '#/components/schemas/NullableQuantity'
        is_active:
          type: boolean
          default: true
    UpdateProductRequest:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        category_id:
          $ref: '#/components/schemas/UUID'
        unit:
          $ref: '#/components/schemas/Unit'
        display_unit:
          $ref: '#/components/schemas/DisplayUnit'
        standard_shelf_life_hours:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2147483647
        target_stock:
          $ref: '#/components/schemas/NullableQuantity'
        is_active:
          type: boolean
        expected_revision:
          type: integer
          minimum: 1
          maximum: 2147483646
      minProperties: 2
    CategoryBrief:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name: {type: string}
    ProductBrief:
      type: object
      required: [id, name, unit, display_unit]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name: {type: string}
        unit:
          $ref: '#/components/schemas/Unit'
        display_unit:
          $ref: '#/components/schemas/DisplayUnit'
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductBrief'
        - type: object
          required: [category, standard_shelf_life_hours, target_stock, is_active, revision, created_at]
          properties:
            category:
              $ref: '#/components/schemas/CategoryBrief'
            standard_shelf_life_hours: {type: integer, minimum: 1, nullable: true}
            target_stock:
              $ref: '#/components/schemas/NullableQuantity'
            is_active: {type: boolean}
            revision: {type: integer, format: int64, minimum: 1}
            created_at: {type: string, format: date-time}
    ProductListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    InventoryProduct:
      allOf:
        - $ref: '#/components/schemas/ProductBrief'
        - type: object
          required: [is_active, category]
          properties:
            is_active: {type: boolean}
            category:
              $ref: '#/components/schemas/CategoryBrief'
    InventoryItem:
      type: object
      required:
        - product
        - physical_quantity
        - available_quantity
        - expiring_quantity
        - expired_quantity
        - target_stock
        - deficit_quantity
        - batches_count
        - nearest_expires_at
        - remaining_seconds
        - has_expiring
        - has_expired
        - is_out_of_stock
        - status
      description: |
        physical_quantity = available_quantity + expired_quantity.
        expiring_quantity входит в available_quantity.
        Бейдж выбирается в порядке expired, expiring, normal, out_of_stock.
        Признаки могут пересекаться. deficit_quantity — рекомендация закупки,
        max(target_stock - available_quantity, 0), null без target_stock.
        Ближайший срок только годных ненулевых партий.
        Без такой партии nearest_expires_at и remaining_seconds — null.
      properties:
        product:
          $ref: '#/components/schemas/InventoryProduct'
        physical_quantity:
          $ref: '#/components/schemas/InventoryQuantity'
        available_quantity:
          $ref: '#/components/schemas/InventoryQuantity'
        expiring_quantity:
          $ref: '#/components/schemas/InventoryQuantity'
        expired_quantity:
          $ref: '#/components/schemas/InventoryQuantity'
        target_stock:
          $ref: '#/components/schemas/NullableQuantity'
        deficit_quantity:
          $ref: '#/components/schemas/NullableQuantity'
        batches_count:
          type: integer
          minimum: 0
          description: Число ненулевых партий, включая просроченные
        nearest_expires_at: {type: string, format: date-time, nullable: true}
        remaining_seconds:
          type: integer
          format: int64
          nullable: true
          description: floor((nearest_expires_at - meta.server_time) / 1s); null без годной партии
        has_expiring: {type: boolean}
        has_expired: {type: boolean}
        is_out_of_stock:
          type: boolean
          description: available_quantity равно нулю
        status: {type: string, enum: [expired, expiring, normal, out_of_stock]}
    InventoryCounts:
      type: object
      required: [all, expiring, expired, out_of_stock, deficit]
      description: |
        Число продуктов в области search AND category_id до filter и пагинации.
        Каждый признак считается независимо по тем же количествам, что и фильтр.
        all — все продукты этой области; остальные счётчики могут пересекаться.
      properties:
        all: {type: integer, format: int64, minimum: 0}
        expiring: {type: integer, format: int64, minimum: 0}
        expired: {type: integer, format: int64, minimum: 0}
        out_of_stock: {type: integer, format: int64, minimum: 0}
        deficit: {type: integer, format: int64, minimum: 0}
    AttentionBatch:
      type: object
      description: |
        Партия с положительным текущим остатком и собственным просроченным или
        истекающим сроком. status относится к партии, независимо от бейджа продукта.
        remaining_seconds = floor((expires_at - meta.server_time) / 1s).
      required: [batch_id, product_id, product_name, supply_id, supply_number, line_number, remaining_quantity, unit, status, expires_at, remaining_seconds]
      properties:
        batch_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name: {type: string}
        supply_id:
          $ref: '#/components/schemas/UUID'
        supply_number: {type: string}
        line_number: {type: integer, minimum: 1}
        remaining_quantity:
          $ref: '#/components/schemas/PositiveQuantity'
        unit:
          $ref: '#/components/schemas/Unit'
        status: {type: string, enum: [expiring, expired]}
        expires_at: {type: string, format: date-time}
        remaining_seconds: {type: integer, format: int64}
    DashboardSettings:
      type: object
      additionalProperties: false
      required: [restaurant_name, timezone, expiring_threshold_hours]
      properties:
        restaurant_name: {type: string}
        timezone: {type: string, example: Europe/Moscow}
        expiring_threshold_hours: {type: integer, minimum: 1, maximum: 720}
    DashboardResponse:
      type: object
      additionalProperties: false
      required: [expiring_batches_count, expired_batches_count, stop_list_dishes_count, out_of_stock_products_count, attention_batches, attention_total, hot_offers, procurement_recommendations, settings, meta]
      properties:
        expiring_batches_count: {type: integer, format: int64, minimum: 0}
        expired_batches_count: {type: integer, format: int64, minimum: 0}
        stop_list_dishes_count: {type: integer, format: int64, minimum: 0}
        out_of_stock_products_count: {type: integer, format: int64, minimum: 0}
        attention_total: {type: integer, format: int64, minimum: 0}
        attention_batches:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AttentionBatch'
        hot_offers:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/HotOffer'
        procurement_recommendations:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ProcurementItem'
        settings:
          $ref: '#/components/schemas/DashboardSettings'
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              required: [server_time]
    InventoryListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          required: [counts, attention_batches, attention_total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/InventoryItem'
            meta:
              allOf:
                - $ref: '#/components/schemas/Meta'
                - type: object
                  required: [server_time]
            counts:
              $ref: '#/components/schemas/InventoryCounts'
            attention_batches:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/AttentionBatch'
            attention_total: {type: integer, format: int64, minimum: 0}
    ExplicitSupplyLine:
      type: object
      additionalProperties: false
      required: [product_id, quantity, expires_at]
      description: Явный срок; produced_at допустим как факт, shelf_life_hours запрещён
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        quantity:
          $ref: '#/components/schemas/PositiveQuantity'
        expires_at: {type: string, format: date-time}
        produced_at: {type: string, format: date-time}
    CalculatedSupplyLine:
      type: object
      additionalProperties: false
      required: [product_id, quantity, produced_at]
      description: |
        expires_at запрещён. Срок берётся из shelf_life_hours или стандарта продукта.
        При отсутствии обоих — 422 SHELF_LIFE_REQUIRED.
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        quantity:
          $ref: '#/components/schemas/PositiveQuantity'
        produced_at: {type: string, format: date-time}
        shelf_life_hours: {type: integer, minimum: 1}
    CreateSupplyRequest:
      type: object
      required: [number, received_at, items]
      properties:
        number:
          type: string
          minLength: 1
          description: Непустой после trim; уникален в ресторане с учётом регистра
        received_at: {type: string, format: date-time}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/ExplicitSupplyLine'
              - $ref: '#/components/schemas/CalculatedSupplyLine'
    ActorBrief:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name: {type: string}
    Batch:
      type: object
      description: |
        Текущая партия. Статус depleted имеет приоритет при нулевом остатке.
        expires_at <= meta.server_time означает expired для положительного остатка.
        Равенство сроку даёт remaining_seconds = 0; просрочка менее секунды — -1.
      required: [id, product_id, unit, supply, line_number, initial_quantity, remaining_quantity, produced_at, shelf_life_hours, expiry_source, expires_at, remaining_seconds, status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        unit:
          $ref: '#/components/schemas/Unit'
        supply:
          type: object
          required: [id, number, received_at]
          properties:
            id:
              $ref: '#/components/schemas/UUID'
            number: {type: string}
            received_at: {type: string, format: date-time}
        line_number: {type: integer, minimum: 1}
        initial_quantity:
          $ref: '#/components/schemas/PositiveQuantity'
        remaining_quantity:
          $ref: '#/components/schemas/Quantity'
        produced_at: {type: string, format: date-time, nullable: true}
        shelf_life_hours: {type: integer, minimum: 1, nullable: true}
        expiry_source: {type: string, enum: [explicit, calculated]}
        expires_at: {type: string, format: date-time}
        remaining_seconds:
          type: integer
          format: int64
          description: floor(expires_at - server_time) в секундах, отрицательное при просрочке
        status: {type: string, enum: [valid, expiring, expired, depleted]}
        created_at:
          type: string
          format: date-time
          description: Время создания записи партии в системе
    BatchListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Batch'
            meta:
              allOf:
                - $ref: '#/components/schemas/Meta'
                - type: object
                  required: [server_time]
    SupplySummary:
      type: object
      required: [id, number, created_at, received_at, items_count, created_by, status]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        number: {type: string}
        created_at:
          type: string
          format: date-time
          description: Время создания записи поставки в системе; используется для фильтрации и сортировки списка
        received_at:
          type: string
          format: date-time
          description: Фактическое время приёмки, сохранённое в поставке
        items_count: {type: integer, minimum: 1, maximum: 100}
        created_by:
          $ref: '#/components/schemas/ActorBrief'
        status: {type: string, enum: [received]}
    SupplyListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SupplySummary'
    SupplyDetail:
      allOf:
        - $ref: '#/components/schemas/SupplySummary'
        - type: object
          required: [items, meta]
          properties:
            meta:
              allOf:
                - $ref: '#/components/schemas/Meta'
                - type: object
                  required: [server_time]
            items:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: object
                required: [product, batch]
                properties:
                  product:
                    $ref: '#/components/schemas/ProductBrief'
                  batch:
                    $ref: '#/components/schemas/Batch'
    RecipeIngredient:
      type: object
      required: [product_id, product_name, unit, quantity_per_portion]
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name: {type: string}
        unit:
          $ref: '#/components/schemas/Unit'
        quantity_per_portion:
          $ref: '#/components/schemas/PositiveQuantity'
    RecipeInput:
      type: object
      additionalProperties: false
      required:
      - product_id
      - quantity_per_portion
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        quantity_per_portion:
          $ref: '#/components/schemas/PositiveQuantity'
    CreateDishRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - recipe
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        is_active:
          type: boolean
          default: true
        recipe:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeInput'
          maxItems: 100
    UpdateDishRequest:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      minProperties: 2
      properties:
        expected_revision:
          type: integer
          minimum: 1
          maximum: 2147483646
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        is_active:
          type: boolean
        recipe:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeInput'
          maxItems: 100
    PreviewDishRequest:
      type: object
      additionalProperties: false
      required:
      - recipe
      properties:
        recipe:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeInput'
          maxItems: 100
    DishPreview:
      type: object
      required:
      - is_available
      - available_portions
      - requirements
      - shortages
      - meta
      properties:
        is_available:
          type: boolean
        available_portions:
          type: string
          pattern: ^[0-9]+$
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        shortages:
          type: array
          items:
            $ref: '#/components/schemas/Shortage'
        meta:
          $ref: '#/components/schemas/Meta'
    Dish:
      type: object
      required: [id, name, description, is_active, revision, recipe_version, recipe, is_available, available_portions, shortages, unavailability_reasons, meta]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name: {type: string}
        description: {type: string, nullable: true}
        is_active: {type: boolean}
        revision: {type: integer, format: int64, minimum: 1}
        recipe_version:
          type: integer
          minimum: 1
          nullable: true
          description: Версия рецепта; null при отсутствии рецептуры
        recipe:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecipeIngredient'
        is_available: {type: boolean}
        available_portions:
          type: string
          pattern: '^[0-9]+$'
          description: Целое число строкой; для recipe_missing — "0"
          example: '10'
        shortages:
          type: array
          items:
            $ref: '#/components/schemas/Shortage'
        unavailability_reasons:
          type: array
          description: Причины недоступности на одну порцию
          items: {type: string, enum: [ingredient_shortage, only_expired_stock, recipe_missing, dish_inactive]}
        meta:
          $ref: '#/components/schemas/Meta'
    DishListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Dish'
    HotOfferDish:
      type: object
      required: [id, name, recipe_version]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name: {type: string}
        recipe_version: {type: integer, minimum: 1}
    HotOfferBatch:
      type: object
      required: [batch_id, product_id, product_name, supply_id, supply_number, line_number, unit, remaining_quantity, used_for_one_portion, expires_at, remaining_seconds]
      properties:
        batch_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name: {type: string}
        supply_id:
          $ref: '#/components/schemas/UUID'
        supply_number: {type: string}
        line_number: {type: integer, minimum: 1}
        unit:
          $ref: '#/components/schemas/Unit'
        remaining_quantity:
          $ref: '#/components/schemas/PositiveQuantity'
        used_for_one_portion:
          $ref: '#/components/schemas/PositiveQuantity'
        expires_at: {type: string, format: date-time, description: Фактический срок партии в UTC}
        remaining_seconds: {type: integer, format: int64, minimum: 0, description: floor(expires_at - server_time); положительная доля секунды даёт 0}
    HotOffer:
      type: object
      required: [dish, rank, priority_score, priority_level, available_portions, reason, problem_batches]
      properties:
        dish:
          $ref: '#/components/schemas/HotOfferDish'
        rank: {type: integer, format: int64, minimum: 1, description: Место до пагинации после фильтров}
        priority_score:
          type: string
          pattern: '^[0-9]+\.[0-9]{4}$'
          description: Максимальный batch_score от 0 до 100, округлённый только для отображения
          example: '1.6667'
        priority_level: {type: string, enum: [high, medium, low]}
        available_portions: {type: string, pattern: '^[1-9][0-9]*$', description: Число доступных порций по всем годным остаткам без резерва}
        reason: {type: string, description: Русское объяснение по фактическим потреблённым партиям и базовым единицам}
        problem_batches:
          type: array
          minItems: 1
          description: Только затронутые истекающие партии, по сроку, приёмке и ID
          items:
            $ref: '#/components/schemas/HotOfferBatch'
    HotOffersListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/HotOffer'
    AffectedDish:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name: {type: string}
    ProcurementItem:
      type: object
      required: [product_id, product_name, unit, display_unit, available_quantity, expired_quantity, target_stock, recommended_quantity, reason_codes, reason, affected_dishes]
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name: {type: string}
        unit:
          $ref: '#/components/schemas/Unit'
        display_unit:
          $ref: '#/components/schemas/DisplayUnit'
        available_quantity:
          $ref: '#/components/schemas/InventoryQuantity'
        expired_quantity:
          $ref: '#/components/schemas/InventoryQuantity'
        target_stock:
          $ref: '#/components/schemas/PositiveQuantity'
        recommended_quantity:
          $ref: '#/components/schemas/PositiveQuantity'
        reason_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [below_target, no_valid_stock, only_expired_stock]}
        reason: {type: string, description: Объяснение с целевым запасом в базовой единице}
        affected_dishes:
          type: array
          items:
            $ref: '#/components/schemas/AffectedDish'
    ProcurementListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProcurementItem'
    OrderRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: Повторы блюда объединяются; максимум 1000 порций каждого блюда после объединения. Конфликт явно заданных версий повторов даёт 422.
          items:
            type: object
            required: [dish_id, portions]
            additionalProperties: false
            properties:
              dish_id:
                $ref: '#/components/schemas/UUID'
              portions: {type: integer, minimum: 1, maximum: 1000}
              recipe_version:
                type: integer
                minimum: 1
                nullable: true
                description: UI передаёт текущую версию; интеграция может опустить или передать null для актуальной рецептуры. При повторах пропущенная версия принимает явно заданную.
    OrderItemSnapshot:
      type: object
      required: [dish_id, dish_name, portions, recipe_version]
      properties:
        dish_id:
          $ref: '#/components/schemas/UUID'
        dish_name: {type: string}
        portions: {type: integer, minimum: 1, maximum: 1000}
        recipe_version: {type: integer, minimum: 1, nullable: true}
    Requirement:
      type: object
      required: [product_id, product_name, unit, required_quantity, available_quantity, missing_quantity]
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name: {type: string}
        unit:
          $ref: '#/components/schemas/Unit'
        required_quantity:
          $ref: '#/components/schemas/AggregateQuantity'
        available_quantity:
          $ref: '#/components/schemas/AggregateQuantity'
        missing_quantity:
          $ref: '#/components/schemas/AggregateQuantity'
    Shortage:
      allOf:
        - $ref: '#/components/schemas/Requirement'
        - type: object
          required: [expired_quantity, reason_code]
          properties:
            expired_quantity:
              $ref: '#/components/schemas/AggregateQuantity'
            reason_code:
              type: string
              enum: [ingredient_shortage, only_expired_stock]
              description: only_expired_stock — физический остаток состоит только из просрочки
    OrderIssue:
      type: object
      required: [dish_id, code, message, current_recipe_version]
      properties:
        dish_id:
          $ref: '#/components/schemas/UUID'
        code: {type: string, enum: [dish_inactive, recipe_missing, recipe_changed], description: Причина недоступности блюда или несовпадения присланной версии с актуальной}
        message: {type: string}
        current_recipe_version: {type: integer, minimum: 1, nullable: true}
    OrderCheck:
      type: object
      required: [can_create, items, requirements, shortages, issues, meta]
      properties:
        can_create: {type: boolean}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderItemSnapshot'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        shortages:
          type: array
          items:
            $ref: '#/components/schemas/Shortage'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/OrderIssue'
        meta:
          $ref: '#/components/schemas/Meta'
    Allocation:
      type: object
      required: [movement_id, product_id, product_name, unit, batch_id, supply_id, supply_number, line_number, quantity, batch_remaining_quantity_after]
      properties:
        movement_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name: {type: string}
        unit:
