openapi: 3.0.3
info:
  title: Кладовая — API учёта склада и заказов
  version: 0.1.0
  contact:
    name: Команда проекта Кладовая
  description: |
    Стартовый контракт S02-T04 на основе REST API из README.md.
    Реализованы GET /healthcheck, GET /products, GET /products/{id}/batches, GET /inventory,
    POST /supplies, GET /supplies, GET /supplies/{id}, GET /dishes,
    GET /dishes/{id}, GET /stop-list, GET /hot-offers, GET /procurement-recommendations, POST /orders/check, POST /orders,
    GET /orders, GET /orders/{id}, GET /order-attempts, GET /dashboard,
    POST /auth/login, GET /auth/me и POST /auth/logout,
    GET /roles, GET /users, GET /users/{id}, POST /users, PATCH /users/{id}, POST /users/{id}/password,
    GET/POST /product-categories, GET/PATCH /product-categories/{id}, GET/PATCH /products/{id}, POST /products.
    GET/PATCH /settings, GET /audit-log, POST /write-offs и GET /stock-movements,
    GET /analytics/write-offs, GET /analytics/ingredient-shortages и GET /analytics/stop-list-forecast.
    Операции с x-implementation-status: planned
    описывают согласованное будущее поведение, а не доступные сейчас маршруты.
    В каждой стори добавляются её операции, схемы, примеры и статусы реализации.

    Даты: RFC 3339 с timezone; ответы сервера — UTC.
    Количества: точные десятичные JSON-строки в базовых единицах g/ml/pcs,
    до 11 цифр до точки и до 3 после (numeric(14,3)). Для pcs дробь нулевая.
    Суммы партий в InventoryItem могут превышать предел одной партии;
    они возвращаются строками с тремя знаками после точки без ограничения целой части.
    Сервер не использует float64 для складского учёта.

    Ограничения HTTP из S02-T05 уже подключены. Тело любого запроса —
    не более 1048576 байт (1 МиБ); превышение даёт 413 PAYLOAD_TOO_LARGE,
    в том числе при неизвестном Content-Length. Проверяется полное тело.
    Общий token bucket на один процесс backend пополняется со скоростью
    10 разрешений в секунду, максимальный и начальный запас — 20.
    Все клиенты совместно расходуют этот запас; это не отдельный лимит по IP
    или пользователю. Экземпляры backend учитывают частоту независимо.
    При исчерпании запаса — 429 TOO_MANY_REQUESTS и Retry-After: 1.
    GET /healthcheck и GET /ready исключены из ограничения частоты, но лимит тела
    действует и на него. Неизвестные маршруты также проходят ограничения.

    Общие проверки входных коллекций допускают 1–100 строк поставки/корзины
    или ингредиентов рецепта и 1–1000 порций каждого блюда после объединения.
    Подключение этих проверок к бизнес-запросам и объединение корзины
    выполняются при реализации соответствующих planned-операций.

    Фильтры объединяются через AND. Поиск без учёта регистра.
    Каждый query-параметр допускается один раз. Неизвестный параметр,
    неверный фильтр, сортировка, UUID или пагинация дают 422.
    Сортировка стабильная, последний критерий — ID.
    total считается после фильтров, до пагинации; пустой список — 200 с items: [].

    Отсутствующий запрошенный ресурс и неизвестный маршрут дают одинаковый
    формат 404 NOT_FOUND. Неверная ссылка в теле запроса даёт 422 с путём поля.
    Внутренние SQL-ошибки не раскрываются клиенту.
    X-Request-ID связывает ответ с логами; request_id ошибки совпадает с ним.
    Request ID генерируется сервером и не является Idempotency-Key.

    Поставки требуют действующую сессию flagman_session и проверку роли.
    Для POST обязательны X-CSRF-Token и Origin, совпадающий с FRONTEND_ORIGIN
    (по умолчанию http://flagman.localhost). POST /auth/login выдаёт случайную
    12-часовую сессию; в БД хранится SHA-256 cookie-токена. Cookie host-only,
    HttpOnly, SameSite=Lax, Secure при HTTPS frontend или прямом TLS.
    Все реализованные бизнес-маршруты защищены фиксированной матрицей ролей;
    новые маршруты запрещены до явного добавления политики. POST /orders/check
    только читает данные и не требует CSRF. login требует Origin; logout —
    Origin и CSRF. CORS допускает только FRONTEND_ORIGIN с credentials.
    Лимит login на процесс: 20 запросов на адрес соединения и 5 попыток на
    нормализованный email за 15 минут; 429 с Retry-After: 900. Адрес берётся из
    соединения, заголовки пересылки не доверяются. Пароли, cookie и CSRF не логируются.

    UUID и даты примеров иллюстративные: при реальном запросе используйте
    существующие ID и актуальные сроки годности.
servers:
  - url: /api/v1
    description: API на текущем origin, включая frontend через nginx
  - url: http://api.flagman.localhost/api/v1
    description: Прямой доступ к backend через локальный Traefik
tags:
  - name: Auth
    description: Вход, текущая сессия и выход
  - name: Catalog
    description: Категории и администрирование продуктов
  - name: Users
    description: Администрирование пользователей и ролей
  - name: System
    description: Состояние процесса
  - name: Inventory
    description: Продукты и склад
  - name: Supplies
    description: Приём и чтение поставок
  - name: Dishes
    description: Меню и доступность блюд
  - name: Orders
    description: Проверка корзины, создание и чтение заказа
paths:
  /events:
    get:
      tags: [System]
      operationId: streamEvents
      summary: Поток изменений с durable replay
      x-implementation-status: implemented
      description: |
        Все четыре роли, действующая cookie-сессия, без CSRF на GET.
        id — опубликованный cursor, event — тип, data — occurred_at, доступные
        роли topics и списки UUID. Нет request_id, имён, рецептов или секретов.
        Без Last-Event-ID читается только новый хвост; 0 запрашивает всю историю.
        Replay строго по cursor; пропуски sequence допустимы. История минимум
        24 часа после публикации. Старый cursor получает resync.required с
        текущим high-water ID и перечитывает доступные разделы. Некорректный,
        повторный или будущий cursor даёт 422 до начала потока.
        Дубли при reconnect допустимы. Heartbeat-комментарий каждые 20 секунд;
        inventory.time_changed каждые 30 секунд. Сессия проверяется каждый цикл
        и при чтении backlog; отзыв, expiry, disable и shutdown закрывают поток.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Один десятичный неотрицательный int64; не больше durable high-water.
          schema: {type: string, pattern: '^[0-9]{1,19}$'}
          example: '123'
      responses:
        '200':
          description: Длительный поток SSE; каждое сообщение заканчивается пустой строкой.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-cache]}
            X-Accel-Buffering:
              schema: {type: string, enum: ['no']}
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                id: 123
                event: inventory.changed
                data: {"occurred_at":"2026-10-09T09:00:00Z","topics":["inventory"]}

        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /ready:
    get:
      operationId: readiness
      tags: [Health]
      security: []
      summary: Готовность БД и схемы
      description: Проверка полного списка миграций текущей сборки и обязательных таблиц в read-only snapshot; deadline 2 секунды. Не применяет миграции. Независима от liveness.
      responses:
        '200':
          description: База доступна и схема соответствует сборке
        '503':
          description: БД недоступна, миграции отсутствуют или схема не соответствует сборке; без подробностей БД
  /healthcheck:
    get:
      tags: [System]
      operationId: healthcheck
      summary: Проверить, что HTTP-процесс отвечает
      description: |
        Не проверяет готовность БД и миграций. Публичный маршрут.
        Исключён из ограничения частоты. Лимит тела 1 МиБ действует,
        если клиент передаёт тело запроса.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Процесс отвечает
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthcheckResponse'
              example:
                status: ok
                service: umirHack-flagman
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /roles:
    get:
      tags:
      - Users
      operationId: listRoles
      summary: Список четырёх ролей
      description: 'Только admin с действующей сессией. Ответы Cache-Control: no-store.'
      x-implementation-status: implemented
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /users:
    get:
      tags:
      - Users
      operationId: listUsers
      summary: Список пользователей
      description: 'Только admin с действующей сессией. Ответы Cache-Control: no-store. Буквальный поиск по имени/email;
        %, _ и обратный слеш не являются шаблонами. Сортировка name ASC, id ASC. Total до пагинации. Один read-only
        repeatable-read снимок.'
      x-implementation-status: implemented
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: search
        in: query
        schema:
          type: string
        description: Буквальная часть имени или email без учёта регистра
      - name: role
        in: query
        schema:
          type: string
          enum:
          - all
          - admin
          - manager
          - storekeeper
          - order_operator
          default: all
      - name: is_active
        in: query
        schema:
          type: string
          enum:
          - all
          - 'true'
          - 'false'
          default: all
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          default: name
    post:
      tags:
      - Users
      operationId: createUser
      summary: Создать пользователя с начальным паролем
      description: 'Только admin с действующей сессией. Ответы Cache-Control: no-store. Имя обрезается по краям; email
        приводится к нижнему регистру и обрезается, должен быть уникален (409 CONFLICT). Начальный password передаёт
        admin, email-рассылки нет. По умолчанию is_active=true. Пароль и хеш не возвращаются.'
      x-implementation-status: implemented
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
  /users/{id}:
    get:
      tags:
      - Users
      operationId: getUser
      summary: Безопасные детали пользователя
      description: 'Только admin с действующей сессией. Ответы Cache-Control: no-store.'
      x-implementation-status: implemented
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/ResourceID'
    patch:
      tags:
      - Users
      operationId: updateUser
      summary: Изменить пользователя по ожидаемой ревизии
      description: 'Только admin с действующей сессией. Ответы Cache-Control: no-store. Требуется expected_revision
        и хотя бы одно изменяемое поле. Отсутствующие поля сохраняются. 409 REVISION_CONFLICT содержит details.current_revision.
        Смена роли и отключение отзывают все сессии. Последний активный admin защищён от понижения и отключения, включая
        параллельные запросы: 409 LAST_ADMIN_PROTECTED.'
      x-implementation-status: implemented
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
  /users/{id}/password:
    post:
      tags:
      - Users
      operationId: resetUserPassword
      summary: Сбросить пароль пользователя
      description: 'Только admin с действующей сессией. Ответы Cache-Control: no-store. Пароль 12–128 Unicode-символов.
        Требуется expected_revision; 409 REVISION_CONFLICT содержит details.current_revision. Ревизия увеличивается,
        все сессии пользователя отзываются. При сбросе собственного пароля нужен новый login.'
      x-implementation-status: implemented
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPasswordRequest'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Войти по email и паролю
      x-implementation-status: implemented
      security: []
      description: |
        Argon2id; неверные данные и отключённый пользователь дают 401.
        Email нормализуется в lower(trim(email)). Пароль не обрезается.
        Тело JSON не более 4 КиБ. Ответ и ошибки не кешируются.
        Новая независимая сессия живёт 12 часов; Set-Cookie содержит непрозрачный
        токен, JSON содержит только user, csrf_token и session_expires_at.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Сессия создана
          headers:
            Set-Cookie:
              description: flagman_session; Path=/api/v1; Max-Age=43200; HttpOnly; SameSite=Lax; Secure при HTTPS
              schema: {type: string}
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      tags: [Auth]
      operationId: currentSession
      summary: Получить пользователя, CSRF и настройки оболочки
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      description: Текущий активный пользователь; истёкшая или отозванная сессия даёт 401. Cache-Control — no-store.
      responses:
        '200':
          description: Текущая сессия и настройки оболочки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Отозвать текущую сессию
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      description: Отзывает только текущую сессию и удаляет cookie с тем же Path. Cache-Control — no-store.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Текущая сессия отозвана; cookie удалена
          headers:
            Set-Cookie:
              description: Пустая flagman_session; Path=/api/v1; Max-Age=0; Expires в прошлом
              schema: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /product-categories:
    get:
      tags:
      - Catalog
      operationId: listProductCategories
      summary: listProductCategories
      x-implementation-status: implemented
      security:
      - SessionCookie: []
      description: Чтение разрешено всем четырём ролям; изменение только admin. Буквальный поиск имени без учёта регистра.
        Сортировка name ASC, id ASC. Total и страница в одном read-only снимке; пустой items — [].
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
