      summary: Списать количество одной партии с причиной
      x-implementation-status: implemented
      description: |
        Роли admin/manager/storekeeper, Origin/CSRF и Idempotency-Key.
        Можно списать годную или просроченную партию. Количество положительное,
        для pcs целое; причина обрезается и содержит 1–500 символов без управляющих.
        Текущие права, продукт и партия блокируются в порядке actor/product/batch.
        Остаток, manual_writeoff, аудит, outbox и HTTP-результат атомарны.
        Превышение остатка — 409 INSUFFICIENT_BATCH_STOCK.
        Повтор возвращает сохранённый ответ; другое тело — IDEMPOTENCY_CONFLICT;
        параллельный повтор — REQUEST_IN_PROGRESS. Технические ошибки откатывают всё.
        Предметные отказы сохраняют только ответ. Cache-Control no-store.
      parameters:
