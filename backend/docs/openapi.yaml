      description: |
        Только admin; точный Origin и CSRF. Требует expected_revision и хотя бы одно изменяемое поле.
        Отсутствующие поля сохраняются; null, повторы, неизвестные поля и неверные типы запрещены.
        Имя обрезается по краям; timezone — имя IANA, кроме host-dependent Local.
        Конкурирующие сохранения сериализуются; устаревшая ревизия возвращает 409 REVISION_CONFLICT
        с details.current_revision. Включение auto_writeoff_expired запускает автоматическое списание просроченного
        положительного остатка в течение минуты; выключение сохраняет видимую просрочку.
        Успех атомарно увеличивает revision, пишет типизированный аудит до/после и settings.changed outbox.
