          schema: {type: string, enum: [all, available, unavailable], default: all}
          example: available
        - name: sort
          in: query
          schema: {type: string, enum: [name], default: name}
          example: name
      responses:
        '200':
          description: Меню после фильтров
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
