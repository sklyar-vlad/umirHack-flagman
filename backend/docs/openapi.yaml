  /orders/check:
    post:
      tags: [Orders]
      operationId: checkOrder
      summary: Проверить корзину без резервирования и создания заказа
      description: |
        Роли admin, manager, order_operator. Не меняет склад, не создаёт заказ
        или запись отказа. Дефицит и предметные issues возвращаются с 200,
        can_create: false. Неизвестный ID блюда или неверное тело дают 422.
        requirements содержит все ингредиенты, shortages — только недостающие.
        can_create: true только при пустых shortages и issues.
        Одна read-only транзакция repeatable-read и один meta.server_time в UTC.
        Годны только положительные остатки партий с expires_at > server_time.
        Количества суммируются точно до тысячных; общий остаток продукта учитывается один раз.
        items сохраняет порядок первого появления блюда, requirements/shortages сортируются по имени продукта и UUID.
        Расчёт использует актуальные рецептуры всех позиций, включая отключённые и изменённые блюда.
        Присланная устаревшая или будущая версия даёт issue recipe_changed с актуальной версией.
        Запрос требует действующую сессию. CSRF, Origin и Idempotency-Key не требуются для чтения.
        Неверная форма валидного JSON даёт 422; синтаксически некорректный JSON — 400.
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            examples:
              basket:
                $ref: '#/components/examples/OrderRequest'
      responses:
        '200':
          description: Корзина проверена, в том числе при дефиците
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCheck'
              examples:
                available:
                  $ref: '#/components/examples/OrderCheckAvailable'
                shortage:
                  $ref: '#/components/examples/OrderCheckShortage'
                recipeChanged:
                  $ref: '#/components/examples/OrderCheckRecipeChanged'
                unavailable:
                  $ref: '#/components/examples/OrderCheckUnavailable'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Создать заказ и списать ингредиенты по FEFO
      description: |
        Роли admin, manager, order_operator. Повторно проверяет актуальные
        рецептуры и остатки внутри транзакции: check ничего не резервирует.
        Повторы блюда объединяются, итог — не более 1000 порций каждого блюда.
        При успехе создаётся заказ и сохраняются фактические движения по партиям.
        При дефиците — 409 INSUFFICIENT_STOCK с requirements, shortages, attempt_id;
        при смене рецептуры — 409 RECIPE_CHANGED с issues;
        при отключённом/неполном блюде — 409 DISH_UNAVAILABLE с issues.
        Неизвестный ID блюда — 422, а не 404 или предметный дефицит.
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            examples:
              basket:
                $ref: '#/components/examples/OrderRequest'
      responses:
        '201':
          description: Заказ создан, ингредиенты списаны
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Location:
              description: Путь к созданному заказу
              schema: {type: string}
              example: /api/v1/orders/77777777-7777-4777-8777-777777777777
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              examples:
                order:
                  $ref: '#/components/examples/OrderDetail'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Получить заказ и исторические факты списания
      description: |
        Роли admin, manager, order_operator. Названия и версии рецептур — снимки
        на момент заказа. Остатки после движения — исторические, не текущие.
        Корректный UUID отсутствующего заказа — 404; неверный UUID — 422.
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Заказ с распределением по партиям
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              examples:
                order:
                  $ref: '#/components/examples/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: flagman_session
      description: Непрозрачный токен действующей сессии; в БД хранится его SHA-256
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      description: UUID в формате xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      schema:
        $ref: '#/components/schemas/UUID'
      example: 44444444-4444-4444-8444-444444444444
    Page:
      name: page
      in: query
      description: Номер страницы, начиная с 1; допускается только одно значение
      schema: {type: integer, minimum: 1, default: 1}
      example: 1
    PageSize:
      name: page_size
      in: query
      description: Максимальное число элементов страницы
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      example: 50
    Search:
      name: search
      in: query
      description: Поиск по имени без учёта регистра
      schema: {type: string}
      example: Моцарелла
    CategoryID:
      name: category_id
      in: query
      description: Фильтр по категории продукта
      schema:
        $ref: '#/components/schemas/UUID'
      example: 22222222-2222-4222-8222-222222222222
    IsActive:
      name: is_active
      in: query
      description: Активные, неактивные или все записи
      schema: {type: string, enum: ['true', 'false', all], default: 'true'}
      example: 'true'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID отдельной попытки записи, не request ID. Связан с пользователем,
        методом/путём и хешем тела. Результат хранится минимум 24 часа.
        Повтор того же тела возвращает сохранённые статус и тело без повторной записи.
        Другое тело — 409 IDEMPOTENCY_CONFLICT; незавершённый параллельный
        запрос — 409 REQUEST_IN_PROGRESS с Retry-After.
        Хеш вычисляется по исходным байтам тела; изменение пробелов или порядка
        JSON-полей меняет хеш. Область ключа — пользователь, HTTP-метод и путь.
        Завершённый результат хранится минимум 24 часа. Повтор возвращает сохранённые
        статус, тело и Location; X-Request-ID относится к текущему запросу.
        Ошибки разбора, доступа и валидации до транзакции ключ не занимают.
        При expires_at <= текущему времени ключ может считаться новым.
        Очистка истёкшего кеша сохраняет самостоятельную историю отказов.
      schema:
        $ref: '#/components/schemas/UUID'
      example: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Токен из login/me для изменяющего запроса с сессией; проверяется также Origin
      schema: {type: string, minLength: 1}
      example: illustrative-csrf-token
    Origin:
      name: Origin
      in: header
      required: true
      description: Должен точно совпадать с FRONTEND_ORIGIN; по умолчанию http://flagman.localhost
      schema: {type: string}
      example: http://flagman.localhost
  headers:
    RequestID:
      description: UUID текущего HTTP-запроса, совпадает с request_id в ошибке и логах
      schema:
        $ref: '#/components/schemas/UUID'
      example: 99999999-9999-4999-8999-999999999999
  schemas:
    UUID:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      example: 11111111-1111-4111-8111-111111111111
    Quantity:
      type: string
      pattern: '^[0-9]{1,11}(\.[0-9]{1,3})?$'
      description: |
        Точное неотрицательное количество numeric(14,3), максимум 99999999999.999.
        В базовой единице продукта; для pcs дробная часть должна быть нулевой.
        JSON-число, знак, экспонента и округление лишних знаков не допускаются.
      example: '120.000'
    PositiveQuantity:
      description: Положительное количество; ноль запрещён
      allOf:
        - $ref: '#/components/schemas/Quantity'
        - type: string
          pattern: '^(?!0+(\.0+)?$).+$'
      example: '3000.000'
    InventoryQuantity:
      type: string
      pattern: '^[0-9]+\.[0-9]{3}$'
      description: |
        Точная неотрицательная сумма остатков партий в базовой единице продукта.
        Три знака после точки; целая часть может превышать numeric(14,3) одной партии.
        Для pcs дробная часть нулевая. Float и округление не используются.
      example: '199999999999.998'
    AggregateQuantity:
      description: Точное количество агрегата остатков или потребности корзины; может превышать numeric(14,3) одной строки
      allOf:
        - $ref: '#/components/schemas/InventoryQuantity'
    NullableQuantity:
      type: string
      nullable: true
      pattern: '^[0-9]{1,11}(\.[0-9]{1,3})?$'
      description: Количество по правилам Quantity либо null, если значение не задано
      example: '4000.000'
    Unit:
      type: string
      enum: [g, ml, pcs]
      description: Базовая единица продукта; все количества относятся к ней
    DisplayUnit:
      type: string
      enum: [g, kg, ml, l, pcs]
      description: g допускает g/kg, ml — ml/l, pcs — только pcs
    Meta:
      type: object
      additionalProperties: true
      description: |
        Дополнительные сведения, без них — {}. Для расчётов server_time —
        общий момент расчёта ответа в UTC. request_id необязателен.
      properties:
        server_time: {type: string, format: date-time}
        request_id:
          $ref: '#/components/schemas/UUID'
    ListEnvelope:
      type: object
      required: [items, total, page, page_size, meta]
      description: |
        Общая обёртка, конкретная операция уточняет схему элементов items.
        total — число после фильтров до пагинации. items и meta не бывают null.
      properties:
        items:
          type: array
          items: {}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        meta:
          $ref: '#/components/schemas/Meta'
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        request_id:
          $ref: '#/components/schemas/UUID'
    ErrorBody:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          description: Стабильный машинный код; перечень дополняется в каждой стори
          example: NOT_FOUND
        message: {type: string, example: Ресурс не найден}
        details:
          type: object
          additionalProperties: true
          description: |
            Без дополнительных сведений — {}. fields используется при валидации.
            Предметные ошибки дополняют details согласно контракту операции.
          properties:
            fields:
              type: array
              items:
                $ref: '#/components/schemas/FieldViolation'
            requirements:
              type: array
              items:
                $ref: '#/components/schemas/Requirement'
            shortages:
              type: array
              items:
                $ref: '#/components/schemas/Shortage'
            issues:
              type: array
              items:
                $ref: '#/components/schemas/OrderIssue'
            attempt_id:
              $ref: '#/components/schemas/UUID'
    FieldViolation:
      type: object
      required: [path, code, message]
      properties:
        path: {type: string, example: 'items[0].quantity'}
        code: {type: string, example: invalid_value}
        message: {type: string, example: Количество должно быть больше нуля}
    HealthcheckResponse:
      type: object
      required: [status, service]
      properties:
        status: {type: string, enum: [ok]}
        service: {type: string, enum: [umirHack-flagman]}
    CategoryBrief:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name: {type: string}
    ProductBrief:
      type: object
      required: [id, name, unit, display_unit]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name: {type: string}
        unit:
          $ref: '#/components/schemas/Unit'
        display_unit:
          $ref: '#/components/schemas/DisplayUnit'
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductBrief'
        - type: object
          required: [category, standard_shelf_life_hours, target_stock, is_active, revision, created_at]
          properties:
            category:
              $ref: '#/components/schemas/CategoryBrief'
            standard_shelf_life_hours: {type: integer, minimum: 1, nullable: true}
            target_stock:
              $ref: '#/components/schemas/NullableQuantity'
            is_active: {type: boolean}
            revision: {type: integer, format: int64, minimum: 1}
            created_at: {type: string, format: date-time}
    ProductListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    InventoryProduct:
      allOf:
        - $ref: '#/components/schemas/ProductBrief'
        - type: object
          required: [is_active, category]
          properties:
            is_active: {type: boolean}
            category:
              $ref: '#/components/schemas/CategoryBrief'
    InventoryItem:
      type: object
      required:
        - product
        - physical_quantity
        - available_quantity
        - expiring_quantity
        - expired_quantity
        - target_stock
        - deficit_quantity
        - batches_count
        - nearest_expires_at
        - remaining_seconds
        - has_expiring
        - has_expired
        - is_out_of_stock
        - status
      description: |
        physical_quantity = available_quantity + expired_quantity.
        expiring_quantity входит в available_quantity.
        Бейдж выбирается в порядке expired, expiring, normal, out_of_stock.
        Признаки могут пересекаться. deficit_quantity — рекомендация закупки,
        max(target_stock - available_quantity, 0), null без target_stock.
        Ближайший срок только годных ненулевых партий.
        Без такой партии nearest_expires_at и remaining_seconds — null.
      properties:
        product:
          $ref: '#/components/schemas/InventoryProduct'
        physical_quantity:
          $ref: '#/components/schemas/InventoryQuantity'
        available_quantity:
          $ref: '#/components/schemas/InventoryQuantity'
        expiring_quantity:
          $ref: '#/components/schemas/InventoryQuantity'
        expired_quantity:
          $ref: '#/components/schemas/InventoryQuantity'
        target_stock:
          $ref: '#/components/schemas/NullableQuantity'
        deficit_quantity:
          $ref: '#/components/schemas/NullableQuantity'
        batches_count:
          type: integer
          minimum: 0
          description: Число ненулевых партий, включая просроченные
        nearest_expires_at: {type: string, format: date-time, nullable: true}
        remaining_seconds:
          type: integer
          format: int64
          nullable: true
          description: floor((nearest_expires_at - meta.server_time) / 1s); null без годной партии
        has_expiring: {type: boolean}
        has_expired: {type: boolean}
        is_out_of_stock:
          type: boolean
          description: available_quantity равно нулю
        status: {type: string, enum: [expired, expiring, normal, out_of_stock]}
    InventoryCounts:
      type: object
      required: [all, expiring, expired, out_of_stock, deficit]
      description: |
        Число продуктов в области search AND category_id до filter и пагинации.
        Каждый признак считается независимо по тем же количествам, что и фильтр.
        all — все продукты этой области; остальные счётчики могут пересекаться.
      properties:
        all: {type: integer, format: int64, minimum: 0}
        expiring: {type: integer, format: int64, minimum: 0}
        expired: {type: integer, format: int64, minimum: 0}
        out_of_stock: {type: integer, format: int64, minimum: 0}
        deficit: {type: integer, format: int64, minimum: 0}
    AttentionBatch:
      type: object
      description: |
        Партия с положительным текущим остатком и собственным просроченным или
        истекающим сроком. status относится к партии, независимо от бейджа продукта.
        remaining_seconds = floor((expires_at - meta.server_time) / 1s).
      required: [batch_id, product_id, product_name, supply_id, supply_number, line_number, remaining_quantity, unit, status, expires_at, remaining_seconds]
      properties:
        batch_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name: {type: string}
        supply_id:
          $ref: '#/components/schemas/UUID'
        supply_number: {type: string}
        line_number: {type: integer, minimum: 1}
        remaining_quantity:
          $ref: '#/components/schemas/PositiveQuantity'
        unit:
          $ref: '#/components/schemas/Unit'
        status: {type: string, enum: [expiring, expired]}
        expires_at: {type: string, format: date-time}
        remaining_seconds: {type: integer, format: int64}
    InventoryListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          required: [counts, attention_batches, attention_total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/InventoryItem'
            meta:
              allOf:
                - $ref: '#/components/schemas/Meta'
                - type: object
                  required: [server_time]
            counts:
              $ref: '#/components/schemas/InventoryCounts'
            attention_batches:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/AttentionBatch'
            attention_total: {type: integer, format: int64, minimum: 0}
    ExplicitSupplyLine:
      type: object
      additionalProperties: false
      required: [product_id, quantity, expires_at]
      description: Явный срок; produced_at допустим как факт, shelf_life_hours запрещён
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        quantity:
          $ref: '#/components/schemas/PositiveQuantity'
        expires_at: {type: string, format: date-time}
        produced_at: {type: string, format: date-time}
    CalculatedSupplyLine:
      type: object
      additionalProperties: false
      required: [product_id, quantity, produced_at]
      description: |
        expires_at запрещён. Срок берётся из shelf_life_hours или стандарта продукта.
        При отсутствии обоих — 422 SHELF_LIFE_REQUIRED.
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        quantity:
          $ref: '#/components/schemas/PositiveQuantity'
        produced_at: {type: string, format: date-time}
        shelf_life_hours: {type: integer, minimum: 1}
    CreateSupplyRequest:
      type: object
      required: [number, received_at, items]
      properties:
        number:
          type: string
          minLength: 1
          description: Непустой после trim; уникален в ресторане с учётом регистра
        received_at: {type: string, format: date-time}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/ExplicitSupplyLine'
              - $ref: '#/components/schemas/CalculatedSupplyLine'
    ActorBrief:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name: {type: string}
    Batch:
      type: object
      description: |
        Текущая партия. Статус depleted имеет приоритет при нулевом остатке.
        expires_at <= meta.server_time означает expired для положительного остатка.
        Равенство сроку даёт remaining_seconds = 0; просрочка менее секунды — -1.
      required: [id, product_id, unit, supply, line_number, initial_quantity, remaining_quantity, produced_at, shelf_life_hours, expiry_source, expires_at, remaining_seconds, status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        unit:
          $ref: '#/components/schemas/Unit'
        supply:
          type: object
          required: [id, number, received_at]
          properties:
            id:
              $ref: '#/components/schemas/UUID'
            number: {type: string}
            received_at: {type: string, format: date-time}
        line_number: {type: integer, minimum: 1}
        initial_quantity:
          $ref: '#/components/schemas/PositiveQuantity'
        remaining_quantity:
          $ref: '#/components/schemas/Quantity'
        produced_at: {type: string, format: date-time, nullable: true}
        shelf_life_hours: {type: integer, minimum: 1, nullable: true}
        expiry_source: {type: string, enum: [explicit, calculated]}
        expires_at: {type: string, format: date-time}
        remaining_seconds:
          type: integer
          format: int64
          description: floor(expires_at - server_time) в секундах, отрицательное при просрочке
        status: {type: string, enum: [valid, expiring, expired, depleted]}
        created_at:
          type: string
          format: date-time
          description: Время создания записи партии в системе
    BatchListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Batch'
            meta:
              allOf:
                - $ref: '#/components/schemas/Meta'
                - type: object
                  required: [server_time]
    SupplySummary:
      type: object
      required: [id, number, created_at, received_at, items_count, created_by, status]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        number: {type: string}
        created_at:
          type: string
          format: date-time
          description: Время создания записи поставки в системе; используется для фильтрации и сортировки списка
        received_at:
          type: string
          format: date-time
          description: Фактическое время приёмки, сохранённое в поставке
        items_count: {type: integer, minimum: 1, maximum: 100}
        created_by:
          $ref: '#/components/schemas/ActorBrief'
        status: {type: string, enum: [received]}
    SupplyListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SupplySummary'
    SupplyDetail:
      allOf:
        - $ref: '#/components/schemas/SupplySummary'
        - type: object
          required: [items, meta]
          properties:
            meta:
              allOf:
                - $ref: '#/components/schemas/Meta'
                - type: object
                  required: [server_time]
            items:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: object
                required: [product, batch]
                properties:
                  product:
                    $ref: '#/components/schemas/ProductBrief'
                  batch:
                    $ref: '#/components/schemas/Batch'
    RecipeIngredient:
      type: object
      required: [product_id, product_name, unit, quantity_per_portion]
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name: {type: string}
        unit:
          $ref: '#/components/schemas/Unit'
        quantity_per_portion:
          $ref: '#/components/schemas/PositiveQuantity'
    Dish:
      type: object
      required: [id, name, description, is_active, revision, recipe_version, recipe, is_available, available_portions, shortages, unavailability_reasons, meta]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name: {type: string}
        description: {type: string, nullable: true}
        is_active: {type: boolean}
        revision: {type: integer, format: int64, minimum: 1}
        recipe_version:
          type: integer
          minimum: 1
          nullable: true
          description: Версия рецепта; null при отсутствии рецептуры
        recipe:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecipeIngredient'
        is_available: {type: boolean}
        available_portions:
          type: string
          pattern: '^[0-9]+$'
          description: Целое число строкой; для recipe_missing — "0"
          example: '10'
        shortages:
          type: array
          items:
            $ref: '#/components/schemas/Shortage'
        unavailability_reasons:
          type: array
          description: Причины недоступности на одну порцию
          items: {type: string, enum: [ingredient_shortage, only_expired_stock, recipe_missing, dish_inactive]}
        meta:
          $ref: '#/components/schemas/Meta'
    DishListResponse:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Dish'
    OrderRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: Повторы блюда объединяются; максимум 1000 порций каждого блюда после объединения. Конфликт явно заданных версий повторов даёт 422.
          items:
            type: object
            required: [dish_id, portions]
            additionalProperties: false
            properties:
              dish_id:
                $ref: '#/components/schemas/UUID'
              portions: {type: integer, minimum: 1, maximum: 1000}
              recipe_version:
                type: integer
                minimum: 1
                nullable: true
                description: UI передаёт текущую версию; интеграция может опустить или передать null для актуальной рецептуры. При повторах пропущенная версия принимает явно заданную.
    OrderItemSnapshot:
      type: object
      required: [dish_id, dish_name, portions, recipe_version]
      properties:
        dish_id:
          $ref: '#/components/schemas/UUID'
        dish_name: {type: string}
        portions: {type: integer, minimum: 1, maximum: 1000}
        recipe_version: {type: integer, minimum: 1, nullable: true}
    Requirement:
      type: object
      required: [product_id, product_name, unit, required_quantity, available_quantity, missing_quantity]
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name: {type: string}
        unit:
          $ref: '#/components/schemas/Unit'
        required_quantity:
          $ref: '#/components/schemas/AggregateQuantity'
        available_quantity:
          $ref: '#/components/schemas/AggregateQuantity'
        missing_quantity:
          $ref: '#/components/schemas/AggregateQuantity'
    Shortage:
      allOf:
        - $ref: '#/components/schemas/Requirement'
        - type: object
          required: [expired_quantity, reason_code]
          properties:
            expired_quantity:
              $ref: '#/components/schemas/AggregateQuantity'
            reason_code:
              type: string
              enum: [ingredient_shortage, only_expired_stock]
              description: only_expired_stock — физический остаток состоит только из просрочки
    OrderIssue:
      type: object
      required: [dish_id, code, message, current_recipe_version]
      properties:
        dish_id:
          $ref: '#/components/schemas/UUID'
        code: {type: string, enum: [dish_inactive, recipe_missing, recipe_changed], description: Причина недоступности блюда или несовпадения присланной версии с актуальной}
        message: {type: string}
        current_recipe_version: {type: integer, minimum: 1, nullable: true}
    OrderCheck:
      type: object
      required: [can_create, items, requirements, shortages, issues, meta]
      properties:
        can_create: {type: boolean}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderItemSnapshot'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        shortages:
          type: array
          items:
            $ref: '#/components/schemas/Shortage'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/OrderIssue'
        meta:
          $ref: '#/components/schemas/Meta'
    Allocation:
      type: object
      required: [movement_id, product_id, product_name, unit, batch_id, supply_id, supply_number, line_number, quantity, batch_remaining_quantity_after]
      properties:
        movement_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name: {type: string}
        unit:
          $ref: '#/components/schemas/Unit'
        batch_id:
          $ref: '#/components/schemas/UUID'
        supply_id:
          $ref: '#/components/schemas/UUID'
        supply_number: {type: string}
        line_number: {type: integer, minimum: 1}
        quantity:
          $ref: '#/components/schemas/PositiveQuantity'
        batch_remaining_quantity_after:
          $ref: '#/components/schemas/Quantity'
    OrderDetail:
      type: object
      required: [id, number, status, created_at, created_by, items]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        number:
          type: string
          pattern: '^[0-9]+$'
          description: Номер серверной последовательности; пропуски допустимы
        status: {type: string, enum: [completed]}
        created_at: {type: string, format: date-time}
        created_by:
          $ref: '#/components/schemas/ActorBrief'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            allOf:
              - $ref: '#/components/schemas/OrderItemSnapshot'
              - type: object
                required: [id, allocations]
                properties:
                  id:
                    $ref: '#/components/schemas/UUID'
                  recipe_version:
                    type: integer
                    minimum: 1
                    description: Успешный заказ всегда сохраняет конкретную версию рецептуры
                  allocations:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/Allocation'
  responses:
    PayloadTooLarge:
      description: |
        Тело запроса превышает 1048576 байт (1 МиБ). Лимит действует
        независимо от метода и наличия Content-Length; размер проверяется
        до вызова handler. Слишком большое тело не считается ошибкой поля 422.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: Тело запроса превышает допустимый размер
              details: {}
            request_id: 99999999-9999-4999-8999-999999999999
    TooManyRequests:
      description: |
        Исчерпан общий запас разрешений процесса backend. Скорость пополнения —
        10 в секунду, максимальный запас — 20. Все клиенты используют один запас.
        Retry-After предлагает повторить через секунду, но не гарантирует
        успех при продолжающейся нагрузке. GET /healthcheck исключён.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          description: Рекомендованная задержка перед повтором в секундах; текущая реализация возвращает 1
          schema: {type: integer, minimum: 1}
          example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Слишком много запросов
              details: {}
            request_id: 99999999-9999-4999-8999-999999999999
    InvalidJSON:
      description: Синтаксически невалидный JSON
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: INVALID_JSON, message: Некорректный JSON, details: {}}
            request_id: 99999999-9999-4999-8999-999999999999
    Unauthorized:
      description: Нет действующей сессии
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: UNAUTHORIZED, message: Требуется авторизация, details: {}}
            request_id: 99999999-9999-4999-8999-999999999999
    Forbidden:
      description: Недостаточно прав или не пройдена проверка CSRF/Origin
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: FORBIDDEN, message: Недостаточно прав, details: {}}
            request_id: 99999999-9999-4999-8999-999999999999
    NotFound:
      description: |
        Ресурс с корректным UUID не существует. Неизвестный маршрут использует
        тот же формат. Неверный UUID — 422; пустой список — 200 с items: [].
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: NOT_FOUND, message: Ресурс не найден, details: {}}
            request_id: 99999999-9999-4999-8999-999999999999
    Conflict:
      description: |
        Предметный конфликт. Для поставки — в том числе дубликат номера;
        для заказа — INSUFFICIENT_STOCK, RECIPE_CHANGED, DISH_UNAVAILABLE.
        Для идемпотентных операций — IDEMPOTENCY_CONFLICT или REQUEST_IN_PROGRESS.
        Предметные коды дополняют текущий общий CONFLICT в соответствующей стори.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          description: Для REQUEST_IN_PROGRESS — сколько секунд ждать перед повтором
          schema: {type: integer, minimum: 1}
          example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            generic:
              value:
                error: {code: CONFLICT, message: Конфликт состояния ресурса, details: {}}
                request_id: 99999999-9999-4999-8999-999999999999
            idempotencyConflict:
              value:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: Этот ключ уже использован с другим телом запроса
                  details: {}
                request_id: 99999999-9999-4999-8999-999999999999
            requestInProgress:
              value:
                error:
                  code: REQUEST_IN_PROGRESS
                  message: Запрос с этим ключом ещё выполняется
                  details: {}
                request_id: 99999999-9999-4999-8999-999999999999
            insufficientStock:
              $ref: '#/components/examples/InsufficientStock'
    ValidationError:
      description: |
        Ошибка поля, ссылки, query-параметра, UUID, даты или количества.
        Для отсутствующего стандартного срока поставки возможен код SHELF_LIFE_REQUIRED.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            page:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Некорректные данные
                  details:
                    fields:
                      - path: page
                        code: invalid_value
                        message: Ожидается целое число больше нуля
                request_id: 99999999-9999-4999-8999-999999999999
            quantity:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Некорректные данные
                  details:
                    fields:
                      - path: items[0].quantity
                        code: must_be_positive
                        message: Количество должно быть больше нуля
                request_id: 99999999-9999-4999-8999-999999999999
    InternalError:
      description: Внутренняя ошибка; SQL, stack trace и другие внутренние сведения не возвращаются
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: INTERNAL_ERROR, message: Внутренняя ошибка сервера, details: {}}
            request_id: 99999999-9999-4999-8999-999999999999
    Unavailable:
      description: Сервис временно недоступен, в том числе из-за недоступной БД
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: SERVICE_UNAVAILABLE, message: Сервис временно недоступен, details: {}}
            request_id: 99999999-9999-4999-8999-999999999999
  examples:
    EmptyList:
      summary: Пустой список — успешный ответ, не 404
      value:
        items: []
        total: 0
        page: 1
        page_size: 50
        meta: {}
    ProductList:
      summary: Каталог продуктов
      value:
        items:
          - id: 11111111-1111-4111-8111-111111111111
            name: Моцарелла
            category: {id: 22222222-2222-4222-8222-222222222222, name: Молочные продукты}
            unit: g
            display_unit: kg
            standard_shelf_life_hours: 72
            target_stock: '4000.000'
            is_active: true
            revision: 1
            created_at: '2026-10-07T06:00:00Z'
        total: 1
        page: 1
        page_size: 50
        meta: {}
    BatchList:
      summary: status=all — все четыре статуса, включая точную границу срока
      value:
