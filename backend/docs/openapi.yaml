  /hot-offers:
    get:
      tags: [Dishes]
      operationId: getHotOffers
      summary: Получить блюда для приоритетной продажи
      description: |
        Роли admin, manager, order_operator. Только активные доступные блюда
        с последней рецептурой. Для каждого независимо симулируется одна порция
        общим FEFO-планировщиком без резервирования или записей в склад.
        Учитываются только реально потреблённые партии с положительным остатком
        при T < expires_at <= T + H; H — expiring_threshold_hours из настроек
        (без строки настроек — 24 часа), T = meta.server_time.
        Настройки, рецептуры, остатки и факты поставок читаются в одном read-only
        Repeatable Read снимке. h — точное время до истечения в часах.
        batch_score = 100 * (1 - h/H) * used_for_one_portion / remaining_quantity;
        priority_score = максимум. При h=H балл нулевой, но предложение включается.
        Сравнения точные, без промежуточного округления; отображение — четыре знака.
        Порядок — score DESC, ближайший затронутый срок ASC, ID блюда ASC.
        high при ближайшем h <= H/4, medium при h <= H/2, иначе low.
        search — буквальная часть имени блюда без учёта регистра; sort не принимается.
        total и rank относятся к полному отфильтрованному списку до пагинации.
        Следующее чтение пересчитывает результат после поставки, заказа, рецепта,
        смены настроек или истечения срока; просроченные и исчерпанные партии исчезают.
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Горячие предложения; пустая страница содержит items []
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotOffersListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Получить обзор состояния всего склада
      description: |
        Роли admin, manager, storekeeper, order_operator. Query-параметров нет.
        Один read-only Repeatable Read снимок и UTC meta.server_time для всех
        блоков. Счётчики не ограничиваются размером превью: положительные партии
        с expires_at <= T просрочены, T < expires_at <= T + threshold истекают.
        Стоп-лист считает активные недоступные блюда по последней рецептуре;
        отсутствие продуктов — все продукты без годного остатка, включая неактивные.
        attention_batches — первые 20 проблемных партий по expires_at, ID;
        attention_total — их полное число. hot_offers и procurement_recommendations
        — первые 3 элемента общей приоритетной сортировки отдельных эндпоинтов.
        Кладовщик получает hot_offers: [], оператор procurement_recommendations: [].
        Роли не меняют общие счётчики, внимание склада и настройки оболочки.
      x-implementation-status: implemented
      responses:
        '200':
          description: Согласованная сводка всего склада; пустые блоки возвращаются как []
          headers:
