          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Supplies]
      operationId: createSupply
      summary: Принять поставку и создать партии
      description: |
        Роли admin, manager, storekeeper. Вся поставка сохраняется атомарно.
        Каждая строка создаёт отдельную партию; повтор продукта допустим.
        Количество положительное, для pcs целое. Просроченная строка даёт 422
        без сохранения всей поставки. Номер обрезается по краям, должен быть
        непустым и уникальным в ресторане с учётом регистра.
        Строка задаёт expires_at либо produced_at с необязательным сроком.
        Без срока используется стандарт продукта; если его нет — 422 SHELF_LIFE_REQUIRED.
        Location указывает на детали созданной поставки.
        Тело ответа строится и сохраняется до commit; 201 отправляется после commit.
        Повтор с тем же ключом и телом возвращает сохранённый статус, тело и Location.
        meta.server_time фиксирует время расчёта статусов партий.
        Невалидный JSON и проверки входных данных до транзакции не занимают ключ.
        Проверки состояния продуктов и срока по текущему времени выполняются
        после сериализации ключа; завершённые предметные отказы сохраняются.
