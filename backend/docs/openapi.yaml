  /products/{id}/batches:
    get:
      tags: [Inventory]
      operationId: listProductBatches
      summary: Получить партии продукта с текущими остатками и сроками
      description: |
        Реализовано в S07-T04. Доступно всем четырём ролям при действующей сессии.
        Без status возвращаются все ненулевые партии; status=all включает израсходованные.
        Партии отключённых продуктов доступны. Неизвестный продукт — 404;
        существующий продукт без подходящих партий — 200 с items: [].
        supply_id и status объединяются через AND; неизвестная поставка даёт пустой список.
        По умолчанию expires_at ASC, id ASC; sort=-created_at — created_at DESC, id ASC.
        total считается после фильтров, до пагинации, в том же снимке, что и страница.
        Статусы и оставшиеся секунды рассчитываются на одно T = meta.server_time.
        depleted имеет приоритет при нулевом остатке; иначе expires_at <= T — expired,
        T < expires_at <= T + expiring_threshold_hours — expiring, позже — valid.
        При expires_at = T статус expired (или depleted при нуле), remaining_seconds = 0.
        Порог из настроек ресторана, без строки настроек — 24 часа.
        remaining_seconds — floor((expires_at - T) / 1s), в том числе у depleted.
        Фактический срок не пересчитывается по стандарту продукта; даты ответа — UTC.
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: Без параметра — ненулевые партии; all включает depleted
          schema: {type: string, enum: [all, valid, expiring, expired, depleted]}
          example: all
        - name: supply_id
          in: query
          description: Ограничить партии данного продукта одной поставкой
          schema:
            $ref: '#/components/schemas/UUID'
        - name: sort
          in: query
          schema: {type: string, enum: [expires_at, '-created_at'], default: expires_at}
      responses:
        '200':
          description: Партии после фильтров; пустая выборка также успешна
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchListResponse'
              examples:
                batches:
                  $ref: '#/components/examples/BatchList'
                empty:
                  value:
                    items: []
                    total: 0
                    page: 1
                    page_size: 50
                    meta: {server_time: '2026-10-10T12:00:00Z'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /inventory:
    get:
      tags: [Inventory]
      operationId: listInventory
      summary: Получить остатки, статусы продуктов и проблемные партии
      description: |
        Агрегаты реализованы в S07-T02, поиск и фильтры проверены в S07-T03.
        Включает продукты без партий и неактивные продукты.
        Доступно всем четырём ролям. counts учитывает поиск и категорию,
        но игнорирует filter и пагинацию; фильтры пересекаются.
        attention_batches — первые 20 проблемных партий по expires_at, id
        в том же поиске/категории; attention_total — их полное число.
        nearest_expires_at сортируется с null в конце.
        Все агрегаты используют один момент T = meta.server_time и один снимок БД.
        available: expires_at > T; expired: expires_at <= T.
        expiring входит в available и имеет expires_at <= T + expiring_threshold_hours.
        Порог берётся из настроек ресторана, без строки настроек — 24 часа.
        Нулевые партии не входят в batches_count, ближайший срок и attention_batches.
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CategoryID'
        - name: filter
          in: query
          description: |
            Фильтрация по количествам независимо от основного status продукта.
            expiring: expiring_quantity > 0; expired: expired_quantity > 0;
            out_of_stock: available_quantity = 0; deficit: deficit_quantity > 0.
            Продукт может одновременно входить в несколько фильтров.
          schema:
            type: string
            enum: [all, expiring, expired, out_of_stock, deficit]
            default: all
          example: expiring
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, nearest_expires_at]
            default: name
          example: nearest_expires_at
      responses:
        '200':
          description: Складская выборка с агрегатами
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryListResponse'
              examples:
                inventory:
                  $ref: '#/components/examples/InventoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /supplies:
    get:
      tags: [Supplies]
      operationId: listSupplies
      summary: Получить список поставок
      description: |
        Поиск по буквальной части номера без учёта регистра; пустой search
        не ограничивает выборку. Символы %, _ и обратный слеш не являются
        шаблонами. Фильтры объединяются через AND.
        from включительно и to исключительно ограничивают created_at,
        а не received_at. RFC3339 с timezone; from <= to, равные границы
        возвращают пустой список. Порядок created_at DESC, id DESC.
        total учитывает фильтры до пагинации; страница за концом списка
        возвращает items: [] с исходным total. meta — {}.
        Требуется действующая сессия и роль admin, manager или storekeeper.
      x-implementation-status: implemented
