      operationId: getProcurementRecommendations
      summary: Получить необходимые закупки
      description: |
        Роли admin, manager, storekeeper. Закупка равна max(0, target_stock -
        available_quantity); только положительные рекомендации для заданных целей.
        Просрочка не уменьшает закупку. Продукты и последние рецепты активных
        блюд читаются в одном read-only Repeatable Read снимке на meta.server_time.
        affected_dishes связывает только блюда с недостатком данного ингредиента.
        Приоритет до пагинации: число связанных блюд убывает, затем нулевой годный
        остаток, затем имя/ID возрастают. sort не принимается.
        Причины: below_target всегда, no_valid_stock при нуле годного остатка,
        дополнительно only_expired_stock при положительной просрочке.
      x-implementation-status: implemented
