  responses:
    PayloadTooLarge:
      description: |
        Тело запроса превышает 1048576 байт (1 МиБ). Лимит действует
        независимо от метода и наличия Content-Length; размер проверяется
        до вызова handler. Слишком большое тело не считается ошибкой поля 422.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: Тело запроса превышает допустимый размер
              details: {}
            request_id: 99999999-9999-4999-8999-999999999999
    TooManyRequests:
      description: |
        Исчерпан общий запас разрешений процесса backend. Скорость пополнения —
        10 в секунду, максимальный запас — 20. Все клиенты используют один запас.
        Retry-After предлагает повторить через секунду, но не гарантирует
        успех при продолжающейся нагрузке. GET /healthcheck и GET /ready исключены.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          description: Рекомендованная задержка перед повтором в секундах; текущая реализация возвращает 1
          schema: {type: integer, minimum: 1}
          example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Слишком много запросов
              details: {}
            request_id: 99999999-9999-4999-8999-999999999999
    InvalidJSON:
      description: Синтаксически невалидный JSON
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: INVALID_JSON, message: Некорректный JSON, details: {}}
            request_id: 99999999-9999-4999-8999-999999999999
    Unauthorized:
      description: Нет действующей сессии
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: UNAUTHORIZED, message: Требуется авторизация, details: {}}
            request_id: 99999999-9999-4999-8999-999999999999
    Forbidden:
      description: Недостаточно прав или не пройдена проверка CSRF/Origin
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: FORBIDDEN, message: Недостаточно прав, details: {}}
            request_id: 99999999-9999-4999-8999-999999999999
    NotFound:
      description: |
        Ресурс с корректным UUID не существует. Неизвестный маршрут использует
        тот же формат. Неверный UUID — 422; пустой список — 200 с items: [].
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: NOT_FOUND, message: Ресурс не найден, details: {}}
            request_id: 99999999-9999-4999-8999-999999999999
    Conflict:
      description: |
        Предметный конфликт. Для поставки — в том числе дубликат номера;
        для заказа — INSUFFICIENT_STOCK, RECIPE_CHANGED, DISH_UNAVAILABLE.
        Для идемпотентных операций — IDEMPOTENCY_CONFLICT или REQUEST_IN_PROGRESS.
        Предметные коды дополняют текущий общий CONFLICT в соответствующей стори.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          description: Для REQUEST_IN_PROGRESS — сколько секунд ждать перед повтором
          schema: {type: integer, minimum: 1}
          example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            generic:
              value:
                error: {code: CONFLICT, message: Конфликт состояния ресурса, details: {}}
                request_id: 99999999-9999-4999-8999-999999999999
            idempotencyConflict:
              value:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: Этот ключ уже использован с другим телом запроса
                  details: {}
                request_id: 99999999-9999-4999-8999-999999999999
            requestInProgress:
              value:
                error:
                  code: REQUEST_IN_PROGRESS
                  message: Запрос с этим ключом ещё выполняется
                  details: {}
                request_id: 99999999-9999-4999-8999-999999999999
            insufficientStock:
              $ref: '#/components/examples/InsufficientStock'
    ValidationError:
      description: |
        Ошибка поля, ссылки, query-параметра, UUID, даты или количества.
        Для отсутствующего стандартного срока поставки возможен код SHELF_LIFE_REQUIRED.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            page:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Некорректные данные
                  details:
                    fields:
                      - path: page
                        code: invalid_value
                        message: Ожидается целое число больше нуля
                request_id: 99999999-9999-4999-8999-999999999999
            quantity:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Некорректные данные
                  details:
                    fields:
                      - path: items[0].quantity
                        code: must_be_positive
                        message: Количество должно быть больше нуля
                request_id: 99999999-9999-4999-8999-999999999999
    InternalError:
      description: Внутренняя ошибка; SQL, stack trace и другие внутренние сведения не возвращаются
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: INTERNAL_ERROR, message: Внутренняя ошибка сервера, details: {}}
            request_id: 99999999-9999-4999-8999-999999999999
    Unavailable:
      description: Сервис временно недоступен, в том числе из-за недоступной БД
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: SERVICE_UNAVAILABLE, message: Сервис временно недоступен, details: {}}
            request_id: 99999999-9999-4999-8999-999999999999
