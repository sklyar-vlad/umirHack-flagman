# Same frontend forwarding/stream flush settings as infrastructure/compose.yaml.
# The test uses a file provider so it needs no privileged Docker socket mount.
http:
  routers:
    frontend:
      rule: PathPrefix(`/`)
      entryPoints: [web]
      service: frontend
  services:
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:80
        responseForwarding:
          flushInterval: -1ms
