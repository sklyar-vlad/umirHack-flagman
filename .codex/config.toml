[features]
hooks = true

[mcp_servers.serena]
command = "/Users/nncl/.local/bin/uvx"
args = ["--from", "git+https://github.com/oraios/serena@949a27ef1e5fda1a6e7b561e777bcece345c6ffd", "serena", "start-mcp-server", "--context", "codex", "--project-from-cwd", "--open-web-dashboard", "false"]
required = true
startup_timeout_sec = 120
tool_timeout_sec = 180

[mcp_servers.yougile]
url = "https://ru.yougile.com/data/ai/mcp"
bearer_token_env_var = "YOUGILE_TOKEN"
enabled_tools = ["get_task_data", "get_task_subtasks", "query_tasks", "get_project_tree", "list_users", "kb_list_pages", "kb_get_page"]
required = true
startup_timeout_sec = 90
tool_timeout_sec = 180
